document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x-direction:column;gap:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\">\n      <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">06<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em\">Color<\u002Fh2><\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#5b534c;max-width:680px;text-wrap:pretty\">CMYK values are conversions for coated stock. Have the printer pull a Pantone match for olive, navy and ink from a proof before the first run.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\"><sc-for list=\"{{ colors }}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;flex-direction:column;gap:0;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,0.06)\">\n          <div style=\"height:120px;background:{{ k.hex }}\"><\u002Fdiv>\n          <div style=\"background:#f4eee2;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#4a433d\">\n            <div style=\"font-size:14px;font-weight:500;color:#1a2332\">{{ k.name }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-variant-numeric:tabular-nums\">\n              <span style=\"color:#8a8178\">HEX<\u002Fspan><span>{{ k.hex }}<\u002Fspan>\n              <span style=\"color:#8a8178\">RGB<\u002Fspan><span>{{ k.rgb }}<\u002Fspan>\n              <span style=\"color:#8a8178\">CMYK<\u002Fspan><span>{{ k.cmyk }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"color:#6b635b;line-height:1.4\">{{ k.use }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for><\u002Fdiv>\n  <\u002Fsection>\n  \n  <section style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\">\n      <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">07<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em\">Typography<\u002Fh2><\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#5b534c;max-width:680px;text-wrap:pretty\">Three voices: the custom mémé wordmark, a Bodoni for “on 10”, and a geometric sans for the tagline and menu text.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n        <div style=\"display:grid;grid-template-columns:160px 1fr 260px;gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #e2dbd0\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Wordmark<\u002Fdiv>\n        <div style=\"\"><svg sc-camel-view-box=\"0 0 600 274\" width=\"180\" style=\"display:block\"><use href=\"#wm\" x=\"0\" y=\"0\" width=\"600\" height=\"274\" fill=\"#1a2332\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Custom lettering, used only as supplied vector. Never retyped.<\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:160px 1fr 260px;gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #e2dbd0\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">“on 10”<\u002Fdiv>\n        <div style=\"font-family:'Bodoni Moda',serif;font-weight:500;font-variation-settings:'opsz' 6;font-size:64px;line-height:1\">on 10<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Bodoni Moda, weight 500, optical size 6 (sturdy hairlines). Free on Google Fonts. Lowercase only.<\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:160px 1fr 260px;gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #e2dbd0\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Tagline<\u002Fdiv>\n        <div style=\"font-family:{{ tagFont }};font-size:26px;letter-spacing:0.22em;line-height:1\">KITCHEN &amp; COCKTAILS<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Gotham Book if licensed; Jost as the free stand-in. Caps, tracked 20–25%.<\u002Fdiv>\n      <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:160px 1fr 260px;gap:24px;align-items:baseline;padding:18px 0;border-bottom:1px solid #e2dbd0\">\n        <div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Body<\u002Fdiv>\n        <div style=\"font-family:'Bodoni Moda',serif;font-size:19px;line-height:1.35\">Three eggs baked with onion, pepper, spices, tahini, pita.<\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Bodoni Moda 400 at text sizes for menu descriptions. Pairs with Jost caps for item names.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n  <\u002Fsection>\n  \n  <section style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\">\n      <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">08<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em\">Menu<\u002Fh2><\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#5b534c;max-width:680px;text-wrap:pretty\">Brunch menu page, built from the current menu photo. Dishes are grouped under small headings so it is easy to scan: one-line header, no divider lines, larger type, prices in the brand color. Downloads as SVG with live type, or as PDF. The groups are a suggestion; check spellings and prices before printing.<\u002Fp>\n    <\u002Fdiv>\n<div style=\"display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;gap:12px;width:880px;max-width:100%\">\n<div style=\"box-shadow:0 2px 6px rgba(0,0,0,0.12),0 24px 48px -24px rgba(0,0,0,0.25)\"><svg id=\"menu-brunch\" sc-camel-view-box=\"0 0 850 1100\" width=\"100%\" style=\"display:block;overflow:hidden\"><rect x=\"0\" y=\"0\" width=\"850\" height=\"1100\" fill=\"#f4eee2\"><\u002Frect><use href=\"#wm\" x=\"64\" y=\"56\" width=\"190\" height=\"87\" fill=\"{{ accent }}\"><\u002Fuse><text x=\"267\" y=\"141\" text-anchor=\"start\" font-family=\"{{ onFont }}\" font-weight=\"500\" style=\"fontVariationSettings:'opsz' 6\" font-size=\"43\" fill=\"{{ accent }}\">on 10<\u002Ftext><text x=\"786\" y=\"141\" text-anchor=\"end\" font-family=\"{{ tagFont }}\" font-size=\"24\" letter-spacing=\"5.6\" fill=\"#1a2332\">KITCHEN &amp; COCKTAILS<\u002Ftext><g id=\"menu-text\"><\u002Fg><\u002Fsvg><\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end;gap:10px\"><button sc-camel-on-click=\"{{ dlMenu }}\" style=\"font:inherit;font-size:12px;background:none;border:1px solid #b9b0a5;border-radius:3px;padding:6px 14px;cursor:pointer;color:#1a2332\" style-hover=\"background:#1a2332;color:#f4eee2\">SVG ↓<\u002Fbutton><button sc-camel-on-click=\"{{ pdfMenu }}\" style=\"font:inherit;font-size:12px;background:none;border:1px solid #b9b0a5;border-radius:3px;padding:6px 14px;cursor:pointer;color:#1a2332\" style-hover=\"background:#1a2332;color:#f4eee2\">PDF ↓<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;max-width:300px\">\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Downloads<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">SVG keeps live type: open it in Illustrator with Bodoni Moda and Jost installed. PDF opens your print window; choose Save as PDF.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Page<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">US Letter, 8.5 x 11 in.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Header<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Awning row without the squiggle: wordmark and on 10 in the brand color, tagline in ink.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Dish name<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Jost 500, caps, tracked, 14.5 pt.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Description<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Bodoni Moda 400, 14 pt, ink.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:4px\"><div style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#6b635b\">Price<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Bodoni Moda 16 pt, brand color, no currency sign.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n  \n  \n<section style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\">\n      <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">09<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em extPath href=\"#arcWide\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">COCKTAILS &amp; KITCHEN<\u002FtextPath><\u002Ftext><\u002Fsc-if><\u002Fsvg><span style=\"font-size:11px;color:#6b635b\">1.5 in / 144 px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><svg sc-camel-view-box=\"0 0 600 150\" width=\"120\" style=\"display:block\"><use href=\"#wm\" x=\"{{ opWmX }}\" y=\"6\" width=\"300\" height=\"137\" fill=\"#1a2332\"><\u002Fuse><text x=\"{{ opOnX }}\" y=\"142\" text-anchor=\"start\" font-family=\"{{ onFont }}\" font-weight=\"500\" style=\"fontVariationSettings:'opsz' 6\" font-size=\"64\" fill=\"#1a2332\">on 10<\u002Ftext><\u002Fsvg><span style=\"font-size:11px;color:#6b635b\">0.75 in / 72 px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;align-items:center\"><svg sc-camel-view-box=\"0 0 600 274\" width=\"48\" style=\"display:block\"><use href=\"#wm\" x=\"0\" y=\"0\" width=\"600\" height=\"274\" fill=\"#1a2332\"><\u002Fuse><\u002Fsvg><span style=\"font-size:11px;color:#6b635b\">0.5 in / 48 px<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Minimum sizes. Below these widths the tagline breaks up: drop to the “mémé on 10” lockup, then to the wordmark alone. Never scale the full logo smaller than shown.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section id=\"website\" style=\"display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\">\n      <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">10<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em\">Use on your website<\u002Fh2><\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#5b534c;max-width:680px;text-wrap:pretty\">Already have a site? Add these styles once, then put the class names on your existing headings, text, links and buttons. No rebuild needed.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\"><div style=\"background:#f4eee2;padding:20px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">1<\u002Fdiv><div style=\"font-size:14px;font-weight:500\">Add the styles<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Copy the code below and paste it at the end of your site's stylesheet, or upload the .css file and link it.<\u002Fdiv><\u002Fdiv><div style=\"background:#f4eee2;padding:20px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">2<\u002Fdiv><div style=\"font-size:14px;font-weight:500\">Add the class names<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Put meme-heading, meme-text, meme-link, meme-price and meme-button on the matching parts of your pages. Use meme-page or meme-dark on a section for the background.<\u002Fdiv><\u002Fdiv><div style=\"background:#f4eee2;padding:20px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:{{ accent }}\">3<\u002Fdiv><div style=\"font-size:14px;font-weight:500\">Add the logo<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#5b534c\">Open a logo artboard above, download the SVG, and paste it right into your page code (not as an image tag) so the fonts show correctly.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:12px\"><button sc-camel-on-click=\"{{ copyCss }}\" style=\"background:{{ accent }};color:#f4eee2;border:0;border-radius:2px;padding:12px 22px;font-family:Jost,sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer\">Copy code<\u002Fbutton><button sc-camel-on-click=\"{{ dlCss }}\" style=\"background:transparent;color:#1a2332;border:1px solid #1a2332;border-radius:2px;padding:12px 22px;font-family:Jost,sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer\">Download .css ↓<\u002Fbutton><\u002Fdiv>\n    <pre style=\"margin:0;background:#1a2332;color:#f4eee2;padding:24px;border-radius:4px;font-size:12px;line-height:1.55;overflow:auto;max-height:420px;white-space:pre\">{{ cssText }}<\u002Fpre>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\"><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:#56603c\">11<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em\">The idea<\u002Fh2><\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#5b534c;max-width:680px;text-wrap:pretty\">From the Brand World guide, draft 2.<\u002Fp><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px\"><div style=\"background:#fbf8f2;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);padding:20px 22px\"><div style=\"font-family:'Bodoni Moda',serif;font-weight:700;font-size:19px;margin-bottom:6px\">High and low<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#5b534c\">Proper cocktails in a neighborhood room. Plain, honest pieces next to a few good ones.<\u002Fdiv><\u002Fdiv><div style=\"background:#fbf8f2;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);padding:20px 22px\"><div style=\"font-family:'Bodoni Moda',serif;font-weight:700;font-size:19px;margin-bottom:6px\">The drinks do the talking<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#5b534c\">No taglines. Drink names and ingredients, exactly as on the menu.<\u002Fdiv><\u002Fdiv><div style=\"background:#fbf8f2;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);padding:20px 22px\"><div style=\"font-family:'Bodoni Moda',serif;font-weight:700;font-size:19px;margin-bottom:6px\">Made by hand<\u002Fdiv><div style=\"font-size:13px;line-height:1.55;color:#5b534c\">Your drawings, your hand-drawn logo, uneven ink, real paper.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid #cfc6ba\"><div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'Bodoni Moda',serif;font-size:22px;color:#56603c\">12<\u002Fspan><h2 style=\"margin:0;font-size:17px;font-weight:500;letter-spacing:0.02em\">Brand World type<\u002Fh2><\u002Fdiv><p style=\"margin:0;font-size:13px;line-height:1.5;color:#5b534c;max-width:680px;text-wrap:pretty\">Two families, from the drinks menu. From the Brand World guide, draft 2.<\u002Fp><\u002Fdiv><div style=\"background:#fbf8f2;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,0.06);padding:20px 22px;display:flex;flex-direction:column;gap:16px\"><div style=\"display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:baseline;border-top:1px solid #cfc6ba;padding-top:14px\"><span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6b635b\">Drink names · Bodoni Moda ExtraBold caps<\u002Fspan><div style=\"font-family:'Bodoni Moda',serif;font-weight:700;font-size:40px;line-height:1.05;color:#56603c\">ESPRESSO MARTINI<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:baseline;border-top:1px solid #cfc6ba;padding-top:14px\"><span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6b635b\">Ingredients · Bodoni Moda<\u002Fspan><div style=\"font-family:'Bodoni Moda',serif;font-size:16px;line-height:1.5;color:#56603c\">Vanilla vodka, Bailey’s, Frangelico, Coffee liqueur<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:baseline;border-top:1px solid #cfc6ba;padding-top:14px\"><span style=\"font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#6b635b\">Info · Jost, spaced caps<\u002Fspan><div style=\"font-family:Jost,sans-serif;font-weight:500;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#56603c\">10th Avenue · New York<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script>setTimeout(function(){var h=location.hash.slice(1),e=h&&document.getElementById(h);if(e)e.scrollIntoView();},1500);<\u002Fscript>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;taglineOrder&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Kitchen &amp; Cocktails&quot;,&quot;Cocktails &amp; Kitchen&quot;],&quot;default&quot;:&quot;Kitchen &amp; Cocktails&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagFont&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Jost&quot;,&quot;Gotham&quot;],&quot;default&quot;:&quot;Jost&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Olive&quot;,&quot;Navy&quot;],&quot;default&quot;:&quot;Olive&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  dl(id, name) {\n    const src = document.getElementById(id);\n    if (!src) return;\n    const NS = 'http://www.w3.org/2000/svg';\n    const out = src.cloneNode(true);\n    out.removeAttribute('id'); out.removeAttribute('style');\n    out.setAttribute('xmlns', NS);\n    const [, , w, h] = out.getAttribute('viewBox').split(' ');\n    out.setAttribute('width', w); out.setAttribute('height', h);\n    out.querySelectorAll('use').forEach(u => {\n      const sym = document.querySelector(u.getAttribute('href'));\n      const s = document.createElementNS(NS, 'svg');\n      ['x', 'y', 'width', 'height'].forEach(a => s.setAttribute(a, u.getAttribute(a)));\n      s.setAttribute('viewBox', sym.getAttribute('viewBox')); if (sym.getAttribute('preserveAspectRatio')) s.setAttribute('preserveAspectRatio', sym.getAttribute('preserveAspectRatio'));\n      s.setAttribute('fill', u.getAttribute('fill')); s.innerHTML = sym.innerHTML;\n      u.replaceWith(s);\n    });\n    const defs = document.createElementNS(NS, 'defs');\n    defs.innerHTML = '<style>@import url(\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&amp;family=Libre+Bodoni:wght@400;500;600&amp;family=DM+Serif+Display&amp;family=Prata&amp;family=Playfair+Display:wght@400;500&amp;family=Jost:wght@400;500&amp;family=Figtree:wght@400;500&amp;family=Montserrat:wght@400;500&amp;display=swap\");<\u002Fstyle>';\n    out.querySelectorAll('textPath').forEach(tp => {\n      const p = document.querySelector(tp.getAttribute('href'));\n      if (p && !defs.querySelector('#' + p.id)) defs.appendChild(p.cloneNode(true));\n    });\n    out.insertBefore(defs, out.firstChild);\n    const blob = new Blob(['<?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n' + new XMLSerializer().serializeToString(out)], { type: 'image/svg+xml' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob); a.download = name + '.svg'; a.click();\n    setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n  }\n  fillMenu() {\n    const g = document.getElementById('menu-text');\n    if (!g || !this._menuText) return;\n    const NS = 'http://www.w3.org/2000/svg';\n    while (g.firstChild) g.removeChild(g.firstChild);\n    this._menuText.forEach(l => {\n      const t = document.createElementNS(NS, 'text');\n      t.setAttribute('x', l.x); t.setAttribute('y', l.y); t.setAttribute('text-anchor', l.anchor);\n      t.setAttribute('font-family', l.fam); t.setAttribute('font-size', l.size); t.setAttribute('font-weight', l.wt);\n      if (l.ls) t.setAttribute('letter-spacing', l.ls);\n      t.setAttribute('fill', l.fill); t.textContent = l.t; g.appendChild(t);\n    });\n  }\n  svgString(id) {\n    const src = document.getElementById(id);\n    if (!src) return '';\n    const NS = 'http://www.w3.org/2000/svg';\n    const out = src.cloneNode(true);\n    out.removeAttribute('id'); out.removeAttribute('style');\n    out.setAttribute('xmlns', NS);\n    const [, , w, h] = out.getAttribute('viewBox').split(' ');\n    out.setAttribute('width', w); out.setAttribute('height', h);\n    out.querySelectorAll('use').forEach(u => {\n      const sym = document.querySelector(u.getAttribute('href'));\n      const s = document.createElementNS(NS, 'svg');\n      ['x', 'y', 'width', 'height'].forEach(a => s.setAttribute(a, u.getAttribute(a)));\n      s.setAttribute('viewBox', sym.getAttribute('viewBox'));\n      s.setAttribute('fill', u.getAttribute('fill')); s.innerHTML = sym.innerHTML;\n      u.replaceWith(s);\n    });\n    return new XMLSerializer().serializeToString(out);\n  }\n  printMenu(id) {\n    const svg = this.svgString(id);\n    if (!svg) return;\n    const f = document.createElement('iframe');\n    f.style.cssText = 'position:fixed;left:-9999px;top:0;width:8.5in;height:11in;border:0';\n    f.srcdoc = '<!doctype html><html><head><meta charset=\"utf-8\"><title>meme-on-10-brunch-menu<\u002Ftitle><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Jost:wght@400;500&display=swap\"><style>@page{size:8.5in 11in;margin:0}html,body{margin:0;background:#f4eee2}svg{display:block;width:8.5in;height:11in}<\u002Fstyle><\u002Fhead><body>' + svg + '<\u002Fbody><\u002Fhtml>';\n    f.onload = () => {\n      const w = f.contentWindow;\n      const go = () => { try { w.focus(); w.print(); } catch (e) {} setTimeout(() => f.remove(), 60000); };\n      (w.documen
