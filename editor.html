<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mémé on 10 – Horizontal Logo Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Libre+Bodoni:wght@400;500;600&family=DM+Serif+Display&family=Prata&family=Playfair+Display:wght@400;500&family=Jost:wght@400;500&family=Figtree:wght@400;500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{--ink:#2b2724;--muted:#6b635b;--line:#d9d1c6;--panel:#f6f2ea;--accent:#b35a3e}
*{box-sizing:border-box}
body{margin:0;background:#ece7df;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 7px var(--side,420px);min-height:100vh}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px;gap:14px}
.canvas{flex:1;display:flex;align-items:center;justify-content:center;background:#e3ddd2;border-radius:6px;padding:24px;overflow:hidden}
.canvas svg{cursor:default;max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:13px;border:1px solid #b9b0a5;background:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;color:var(--ink)}
button:hover{background:var(--ink);color:#f3ede1}
button.primary{background:var(--ink);color:#f3ede1;border-color:var(--ink)}
button.primary:hover{background:var(--accent);border-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.panel{background:var(--panel);padding:20px 22px 60px;overflow:auto;max-height:100vh}
h1{font-size:16px;margin:0 0 2px;font-weight:600}
h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:110px 1fr 62px 26px;gap:10px;align-items:center;margin:7px 0}
.row label{font-size:13px}
.row input[type=range]{width:100%;accent-color:var(--ink)}
.row input[type=number]{width:62px;font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:3px;background:#fff}
.lock{width:24px;height:24px;padding:0;border-radius:4px;display:flex;align-items:center;justify-content:center;border-color:transparent;background:none;color:#a39a8f}
.lock:hover{background:#e6dfd3;color:var(--ink)}
.lock.on{background:#1f6fd1;border-color:#1f6fd1;color:#fff}
.lock svg{width:14px;height:14px}
.pick{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:7px 0}
select,input[type=text]{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:#fff;width:100%}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:3px;padding:0;background:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tabs button.on{background:var(--ink);color:#f3ede1;border-color:var(--ink)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.sw button{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid #b9b0a5;overflow:hidden;position:relative}
.sw button i{position:absolute;inset:0;border-radius:50%}
.ver{display:flex;gap:6px;align-items:center;margin:6px 0}
.ver span{flex:1}
.ver button{padding:4px 9px;font-size:12px}
.disabled{opacity:.45;pointer-events:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.grip{display:none}.stage{position:static;height:auto}.canvas{min-height:300px}.panel{max-height:none}}
body.simple .only-full{display:none!important}
.simple-panel h1{font-size:22px;margin:0 0 4px}
.simple-panel .lead{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 6px}
.simple-panel h2{font-size:13px;letter-spacing:.06em;margin:28px 0 12px;padding-top:18px}
.stabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stabs button{padding:14px 10px;font-size:15px}
.stabs button.on{background:var(--ink);color:#f3ede1;border-color:var(--ink)}
.srow{margin:16px 0}
.srow .sl{font-size:15px;font-weight:600;margin-bottom:6px}
.srow input[type=range]{width:100%;height:28px;accent-color:var(--ink)}
.srow .se{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.spick{margin:16px 0}.spick .sl{font-size:15px;font-weight:600;margin-bottom:6px}
.spick select{font-size:15px;padding:10px 8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;font-size:13px}
.chips .dot{width:28px;height:28px;border-radius:50%;border:1px solid #b9b0a5;flex:none}
.link{background:none;border:none;color:#1f6fd1;padding:4px 0;font-size:13px;cursor:pointer;text-decoration:underline}
.link:hover{background:none;color:#1a58a6}
body.simple #btnPdf{font-size:16px;padding:12px 22px}
@media print{
  body{background:none}
  .app{display:block;min-height:0}.panel,.bar,.hint,.grip{display:none!important}
  .stage{position:static;height:auto;padding:0}
  .canvas{background:none;padding:0;border-radius:0;display:block}
  .canvas svg{max-width:none;max-height:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.panel h2.sel{color:#1f6fd1}.panel h2.sel::before{content:'● '}
/* ---- v25 sidebar ---- */
.grip{position:sticky;top:0;height:100vh;cursor:col-resize;border-left:1px solid var(--line);background:var(--panel);touch-action:none;outline:none}
.grip:hover,.grip.on,.grip:focus-visible{background:#d9d1c6;border-left-color:#b9b0a5}
body.resizing{cursor:col-resize;user-select:none}
.canvas{outline:none}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav{margin:6px 0 0;font-size:14px}.nav a{color:#1f6fd1}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:36px;height:20px;border-radius:10px;background:#c9c0b4;position:relative;transition:background .15s}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.track{background:var(--ink)}
.switch input:checked+.track .knob{left:18px}
.switch input:focus-visible+.track{outline:2px solid #1f6fd1;outline-offset:2px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.lgroups{display:flex;flex-wrap:wrap;gap:10px 16px}
.lgl{font-size:11px;color:var(--muted);margin-bottom:5px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #b9b0a5;border-radius:6px;overflow:hidden;background:#fff;max-width:100%}
.seg button{border:none;border-radius:0;border-right:1px solid #e3dccf;padding:8px 12px;background:#fff}
.seg button:last-child{border-right:none}
.seg button small{font-size:10px;opacity:.6;margin-left:5px}
.seg button.on{background:var(--ink);color:#f3ede1}
.seg button:not(.on):hover{background:#efe9df;color:var(--ink)}
.seg.small button{padding:5px 10px;font-size:12px}
.helpbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--muted);margin:16px 0 6px}
.helpbox b{color:var(--ink)}
.inlock{display:inline-block;width:13px;height:13px;vertical-align:-2px}.inlock svg{width:13px;height:13px}
.acc{background:#fff;border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:10px;border:none;border-radius:0;background:none;padding:13px 14px;font-size:14px;font-weight:600;text-align:left}
.acc-h:hover{background:#faf7f1;color:var(--ink)}
.chev{width:15px;height:15px;flex:none;transition:transform .15s;color:var(--muted)}
.acc.open .chev{transform:rotate(90deg)}
.acc-t{flex:1}
.acc-badge{display:none;font-size:11px;font-weight:600;color:#1f6fd1}
.acc.sel{border-color:#1f6fd1;box-shadow:0 0 0 1px #1f6fd1}
.acc.sel .acc-badge{display:inline}
.acc-b{display:none;padding:6px 14px 14px;border-top:1px solid var(--line)}
.acc.open .acc-b{display:block}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto 26px;gap:10px;align-items:center;margin:8px 0}
.row2>label{font-size:13px;line-height:1.3}
.row2.stack{grid-template-columns:1fr}.row2.stack>span{display:none}
.row2 select{width:auto;max-width:210px}
.row2 input[type=color]{width:128px;height:30px}
.stepper{display:flex;border:1px solid #b9b0a5;border-radius:5px;overflow:hidden;background:#fff}
.stepper .sb{-webkit-tap-highlight-color:transparent;border:none;border-radius:0;padding:0;width:34px;height:30px;font-size:17px;line-height:1;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.stepper .sb:hover{background:#efe9df;color:var(--ink)}
.stepper .sb:active{background:#e3dccf}
.stepper input{width:64px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:inherit;font-size:13px;padding:0 2px;-moz-appearance:textfield;appearance:textfield;background:#fff}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.checkrow{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px}
.steps{padding-left:20px;margin:12px 0 10px;line-height:1.7;font-size:14px}.steps li{margin:6px 0}.steps button{padding:4px 10px}
.steps a,.acc .hint a{color:#1f6fd1}
.pastebox{width:100%;min-height:150px;font:13px ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:6px;resize:vertical;background:#fff}
.foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
#menuModes.menuseg{display:grid;grid-template-columns:1fr 1fr}.menuseg button{padding:10px 6px;font-size:13px;white-space:nowrap;border-bottom:1px solid #e3dccf}.menuseg button:nth-child(2n){border-right:none}.menuseg button:nth-child(n+3){border-bottom:none}
body.simple .row2>label,body.simple .checkrow{font-size:14px}
body.simple .stepper .sb{width:40px;height:34px}
</style>
</head>

</div>

let HAND=null;
function handShape(){
  if(HAND) return HAND;
  const subs=D.oval.split(/(?=M)/).filter(s=>s.trim());
  const holder=document.createElementNS(NS,'svg'); holder.style.cssText='position:absolute;width:0;height:0;visibility:hidden'; document.body.appendChild(holder);
  const pts=d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);holder.appendChild(p);const L=p.getTotalLength(),n=720,a=[];for(let i=0;i<n;i++){const q=p.getPointAtLength(L*i/n);a.push([q.x,q.y]);}return a;};
  const A=pts(subs[0]),B=pts(subs[1]); holder.remove();
  const area=a=>a.reduce((s,p,i)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1]},0);
  const outer=Math.abs(area(A))>Math.abs(area(B))?A:B, inner=outer===A?B:A, N=outer.length;
  let c=[],h=[];
  outer.forEach(p=>{let best=1e9,bq=p;for(const q of inner){const d=(p[0]-q[0])**2+(p[1]-q[1])**2;if(d<best){best=d;bq=q;}}c.push([(p[0]+bq[0])/2,(p[1]+bq[1])/2]);h.push(Math.sqrt(best)/2);});
  const smooth=(arr,w,isPt)=>arr.map((_,i)=>{let sx=0,sy=0,n=0;for(let k=-w;k<=w;k++){const v=arr[(i+k+N)%N];if(isPt){sx+=v[0];sy+=v[1];}else sx+=v;n++;}return isPt?[sx/n,sy/n]:sx/n;});
  c=smooth(c,3,true); h=smooth(h,8,false);
  const sgn=area(c)>0?1:-1;
  HAND={c,h,sgn,avg:2*h.reduce((s,v)=>s+v,0)/N,x0:Math.min(...c.map(p=>p[0])),x1:Math.max(...c.map(p=>p[0])),y0:Math.min(...c.map(p=>p[1])),y1:Math.max(...c.map(p=>p[1]))};

// wordmark box: left x, top y, width w (height scales with it)
function wmBox(S,x,top,baseW,baseH,scale){
  const s=scale/100, k=Math.min(baseW/671,baseH/306)*s;

}
function onEl(S,P,x,y){
  return `<text data-el="on" x="${f(x)}" y="${f(y)}" font-family='"${S.onFont}", serif' font-weight="${S.onWeight}" style="font-variation-settings:'opsz' ${S.opsz}" font-size="${f(P.onSize)}" letter-spacing="${P.onLs}" word-spacing="${f(P.ws)}" fill="${S.ink}">${P.onTxt}</text>`;

// squiggle drawn inside a box (left,top,w,h)
function sqEl(S,left,top,w,h,thick=0){
  const vbH=S.squiggle==='B'?113:105, k=Math.min(w/338,h/vbH);
  const d=S.squiggle==='B'?D.sqB:D.sqA;

  const neg=thick<0&&!S.transparent;
  const grow=(thick>0||neg)?` stroke="${thick>0?sqCol(S):S.bg}" stroke-width="${f(Math.abs(thick)/k)}" stroke-linejoin="round" stroke-linecap="round"`:'';
  return `<g data-el="sq" fill="${sqCol(S)}" transform="translate(${f(left+(w-338*k)/2)} ${f(top+(h-vbH*k)/2)}) scale(${k})"><path fill-rule="evenodd" d="${d}"${grow}/></g>`;
}
function tagInner(S,P){
  return `${P.parts[0]} <tspan font-family='${P.ampFam}' font-size="${P.bod?'115%':'100%'}" font-weight="${P.bod?400:'inherit'}">&amp;</tspan> ${P.parts[1]}`;
}
function shell(S,W,H,body,extraDefs='',bgShape=null){

}

/* ============ MENU TEXT (Menu tab) — follows the brand guidelines, section 08 ============ */
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function menuSVG(S,G,M){
  const sc=G.menuScale/100, ink=G.menuInk, brand=G.menuBrand;
  const cols=+G.columns===2?2:1, L=64, R=786, GAP=48;
  const colW=cols===2?(R-L-GAP)/2:(R-L);
  const xs=cols===2?[L,L+colW+GAP]:[L], rights=xs.map(x=>x+colW);
  const tagFam=`"${S.tagFont}","Montserrat",sans-serif`, dFam=S.tagFont==='Gotham'?'Montserrat':S.tagFont;
  const step=19*sc, toDesc=21*sc, itemGap=34*sc, secGap=48*sc;
  const wrap=(t,w,fam,wt,sz,ls)=>{ const words=String(t||'').replace(/\s+/g,' ').trim().split(' ').filter(Boolean); const lines=[]; let c=''; words.forEach(wd=>{ const tr=c?c+' '+wd:wd; if(c&&measure(tr,fam,wt,sz,ls)>w){lines.push(c);c=wd;} else c=tr; }); if(c) lines.push(c); return lines; };
  let y=200, out='', end=200, first=true;
  M.forEach(sec=>{
    const items=(sec.items||[]).filter(it=>(it.name||'').trim()||(it.desc||'').trim());
    const title=(sec.title||'').trim(), price=(sec.price||'').trim().replace(/^\$/,'');
    if(!title&&!price&&!items.length) return;
    if(!first) y=end+secGap; first=false;
    if(title||price){
      const hs=12*sc, hls=3.4*sc;
      out+=`<text x="${L}" y="${f(y)}" font-family='${tagFam}' font-size="${f(hs)}" font-weight="500" letter-spacing="${f(hls)}" fill="${brand}">${esc(title.toUpperCase())}</text>`;
      if(price){ const px=L+(title?measure(title.toUpperCase(),dFam,500,hs,hls)+hls+16*sc:0); out+=`<text x="${f(px)}" y="${f(y)}" font-family='"Bodoni Moda", serif' font-size="${f(16*sc)}" font-weight="400" fill="${brand}">${esc(price)}</text>`; }
    }
    const dishes=items.map(it=>{
      const pr=(it.price||'').trim().replace(/^\$/,'');
      const nm=wrap((it.name||'').trim().toUpperCase(),pr?colW-70*sc:colW,dFam,500,14.5*sc,1.7*sc);
      const ds=wrap(it.desc,colW,'Bodoni Moda',400,14*sc,0);
      const lastOff=Math.max(0,nm.length-1)*step+(ds.length?(nm.length?toDesc:0)+(ds.length-1)*step:0);
      return {nm,ds,pr,lastOff,h:lastOff+itemGap};
    });
    let groups=[dishes];
    if(cols===2&&dishes.length>1){
      let best=1,bestV=1e9;
      for(let k=1;k<dishes.length;k++){ const a=dishes.slice(0,k).reduce((t,d)=>t+d.h,0), b=dishes.slice(k).reduce((t,d)=>t+d.h,0); const v=Math.max(a,b); if(v<bestV){bestV=v;best=k;} }
      groups=[dishes.slice(0,best),dishes.slice(best)];
    }
    const y0=(title||price)?y+itemGap:y; end=y;
    groups.forEach((grp,gi)=>{
      let yy=y0;
      grp.forEach(d=>{
        d.nm.forEach((L2,i)=>{ out+=`<text x="${xs[gi]}" y="${f(yy+i*step)}" font-family='${tagFam}' font-size="${f(14.5*sc)}" font-weight="500" letter-spacing="${f(1.7*sc)}" fill="${ink}">${esc(L2)}</text>`; });
        if(d.pr&&d.nm.length) out+=`<text x="${rights[gi]}" y="${f(yy)}" text-anchor="end" font-family='"Bodoni Moda", serif' font-size="${f(16*sc)}" font-weight="400" fill="${brand}">${esc(d.pr)}</text>`;
        const d0=yy+(d.nm.length?(d.nm.length-1)*step+toDesc:0);
        d.ds.forEach((L2,i)=>{ out+=`<text x="${xs[gi]}" y="${f(d0+i*step)}" font-family='"Bodoni Moda", serif' font-size="${f(14*sc)}" font-weight="400" fill="${ink}" fill-opacity="0.9">${esc(L2)}</text>`; });
        end=Math.max(end,yy+d.lastOff); yy+=d.h;
      });
    });
  });
  return {svg:out,end};
}

      const starts=!pv||l.gap||pv.kind==='head'||(pv.kind==='plain'&&looksDesc(pv.text));

      if(starts&&!looksDesc(l.text)&&l.text.length<=30&&(nx.cell||(nameLike(nx)&&(nx.gap||(nn&&!nn.gap&&!nn.cell&&looksDesc(nn.text)))))) l.kind='head';
    }
  });
  // group into sections; in a section that has bold/CAPITAL dish names, normal lines are descriptions
  const groups=[]; let g=null;
  lines.forEach(l=>{ if(l.kind==='head'||!g){ g={head:l.kind==='head'?l:null,lines:[]}; groups.push(g); if(l.kind==='head') return; } g.lines.push(l); });
  const out=[];
  groups.forEach(gr=>{
    const [title,price]=gr.head?splitPrice(gr.head.text):['',''];
    const sec={title,price,items:[]}; out.push(sec);
    const emph=gr.lines.some(l=>l.kind==='dish'||l.kind==='dishdesc');
    let dish=null;
    const addDish=(name,desc,l,first)=>{ let [n,p]=splitPrice(cleanSep(name)); let d=cleanSep(desc||'');
      if(!p&&d){ const [d2,p2]=splitPrice(d,PRICE_END_SEP); if(p2){ d=d2; p=p2; } }
      dish={name:n,desc:d,price:p,_cell:l.cell,_start:l.gap||first}; sec.items.push(dish); };
    const nameDesc=t=>{ const i=t.indexOf(':'); if(i>0) return [t.slice(0,i),t.slice(i+1)];
      const m=t.match(/\s[–—]\s|\s-\s/); if(m) return [t.slice(0,m.index),t.slice(m.index+m[0].length)]; return [t,'']; };
    const addDesc=t=>{ dish.desc=(dish.desc?dish.desc+' ':'')+t; if(!dish.price){ const [d2,p2]=splitPrice(dish.desc,PRICE_END_SEP); if(p2){ dish.desc=d2; dish.price=p2; } } };
    gr.lines.forEach((l,i)=>{
      if(l.kind==='price'){ const p=l.text.replace('$',''); if(dish&&!dish.price) dish.price=p; else if(!sec.price) sec.price=p; return; }
      if(l.kind==='dish'){ const [n,d]=nameDesc(l.text); addDish(n,d,l,i===0); return; }
      if(l.kind==='dishdesc'){ addDish(l.boldPre,l.text.slice(l.boldPre.length),l,i===0); return; }
      if(emph&&dish&&!l.cell){ addDesc(l.text); return; }
      if(!emph&&dish&&!dish._cell&&!l.cell&&!l.gap){   // no formatting: the line under a dish name is what's in it
        if(!dish.desc&&(looksDesc(l.text)||(hasGaps&&dish._start))){ addDesc(l.text); return; }
        const nxt=gr.lines[i+1], isName=!looksDesc(l.text)&&nxt&&!nxt.gap&&!nxt.cell&&looksDesc(nxt.text);   // a name with its description under it starts a new dish
        if(dish.desc&&!isName&&(/[,;&]$/.test(dish.desc)||/^\p{Ll}/u.test(l.text))){ addDesc(l.text); return; }
      }
      const [n,d]=nameDesc(l.text); addDish(n,d,l,i===0);
    });
  });
  out.forEach(s=>s.items.forEach(it=>{ delete it._cell; delete it._start; }));
  const kept=out.filter(s=>s.items.length);
  return kept.length?kept:out.filter(s=>s.title);
}
// whatever was pasted (a Google Doc, Word, or plain text) -> menu
function readDocPaste(html,plain){
  let m=html?blocksToMenu(docBlocks(html)):[];
  if(!m.reduce((a,s)=>a+s.items.length,0)&&(plain||'').trim()) m=/^\s*#/m.test(plain)?parseMenuText(plain):blocksToMenu(plainBlocks(plain));
  return m;
}
// the menu as "type like a document" text; a section with no title just lists its dishes
function menuAsText(m){
  return m.map(sec=>{
    const head=(sec.title||'').trim()||(sec.price||'').trim()?['# '+[sec.title,sec.price].filter(x=>(x||'').trim()).join(' ')]:[];
    const lines=(sec.items||[]).map(it=>{ const n=(it.name||'').trim(), pr=(it.price||'').trim(), d=(it.desc||'').replace(/\s+/g,' ').trim(); const nm=pr?(n+' ('+pr+')'):n; return d?(nm+': '+d):nm; }).filter(Boolean);
    return head.concat(lines).join('\n');
  }).join('\n\n');
}

function stepperRow(k,label,min,max,step){
  const r=document.createElement('div'); r.className='row2';
  r.innerHTML=`<label></label><div class="stepper"><button type="button" class="sb" aria-label="Less">−</button><input type="number" step="${step}" inputmode="decimal"><button type="button" class="sb" aria-label="More">+</button></div><span class="lk"></span>`;
  r.querySelector('label').textContent=label;
  const [minus,nb,plus]=r.querySelector('.stepper').children;
  nb.setAttribute('aria-label',label);

  const commit=(v,clamp)=>{ v=+v; if(clamp) v=Math.min(max,Math.max(min,v)); v=Math.round(v*1000)/1000;
    const old=get(k); if(v===old) return; put(k,v); propagate(k,old,v); afterSet(k,v); render(); };

  const bump=m=>{ commit(get(k)+m*step,true); nb.value=get(k); };

    let t1=null,t2=null,n=0;
    const stop=()=>{ if(t1===null&&t2===null) return; clearTimeout(t1); clearInterval(t2); t1=t2=null; sync(); };
    btn.addEventListener('pointerdown',e=>{ if(e.button!==0) return; e.preventDefault(); n=0; const sh=e.shiftKey;
      const go=()=>{ n++; bump(dir*(sh?10:1)*(n>20?5:1)); }; go(); t1=setTimeout(()=>{ t2=setInterval(go,70); },400); });

}

      const r=document.createElement('div'); r.className='row2';
      r.innerHTML=`<label></label><input type="color"><span></span>`; r.querySelector('label').textContent=label;
      const inp=r.querySelector('input'); inp.oninput=()=>{put(k,inp.value); render();};
      refs.push(()=>{inp.value=k==='sqColor'?sqCol(S):get(k);});
      add(r); return;
    }
    if(t==='check'){
      const r=document.createElement('label'); r.className='checkrow';
      r.innerHTML=`<input type="checkbox"> <span></span>`; r.querySelector('span').textContent=label;
      const inp=r.querySelector('input'); inp.onchange=()=>{ put(k,inp.checked); if(k==='sqFollow'&&inp.checked) afterSet('thickD',get('thickD')); render(); sync(); };
      refs.push(()=>{inp.checked=!!get(k);});
      add(r); return;
    }
    if(t==='swatches'){
      const d=document.createElement('div'); d.className=simple?'chips':'sw';
      PRESETS.forEach(p=>{
        const b=document.createElement('button'); b.type='button'; b.title=p[0];
        b.innerHTML=simple?`<span class="dot" style="background:linear-gradient(135deg,${p[3]} 0 50%,${p[2]} 50%)"></span><span></span>`:`<i style="background:linear-gradient(135deg,${p[3]} 0 50%,${p[2]} 50%)"></i>`;
        if(simple) b.lastChild.textContent=p[0];
        b.onclick=()=>{S.ink=p[1];S.accent=p[2];S.sqColor=p[2];S.bg=p[3];S.transparent=false;sync();render();};
        d.appendChild(b);
      });
      add(d); return;
    }
    if(t==='versions'){
      const wrap=document.createElement('div');
      wrap.innerHTML='<div class="ver"><input type="text" id="verName" placeholder="Name this version, e.g. Mom’s favorite"><button id="verSave">Save</button></div><div id="verList"></div><div class="hint" id="verNote">Your last settings and saved versions are remembered in this browser automatically. To keep them safe or move them to another computer, use the file buttons.</div><div class="ver" style="margin-top:8px"><button id="verExport">Save versions to a file</button><button id="verImport">Open a versions file</button><input type="file" id="verFile" accept=".json" style="display:none"></div>';
      add(wrap); return;
    }
  });
  finish();
  const foot=document.createElement('div'); foot.className='foot';
  foot.innerHTML='<button id="btnReset">Reset everything</button>';
  foot.insertAdjacentHTML('beforeend',`<details class="hint only-full" style="margin-top:14px"><summary style="cursor:pointer">Editor ${VERSION} · ${VERSION_DATE} · what changed</summary><ul style="padding-left:18px;margin:8px 0">${CHANGELOG.map(c=>`<li><b>${c[0]}</b> ${c[1]}</li>`).join('')}</ul></details>`);
  panel.appendChild(foot);
  document.getElementById('btnReset').onclick=()=>{ if(!confirm('Reset every layout and the menu back to the original? Saved versions are kept.')) return; S=Object.assign({},SHARED_DEFAULTS); M=JSON.parse(JSON.stringify(MENU_DEFAULT));Object.keys(LAYOUTS).forEach(k=>G[k]=Object.assign({},LAYOUTS[k].geo));sync();render();};
  document.getElementById('verSave').onclick=saveVersion;
  document.getElementById('verExport').onclick=()=>{ const cur_={layout:cur,S:Object.assign({},S),G:JSON.parse(JSON.stringify(G)),M:JSON.parse(JSON.stringify(M))}; download(new Blob([JSON.stringify(Object.assign({'(current settings)':cur_},mem),null,1)],{type:'application/json'}),`meme-on-10-logo-editor-saved-versions_${new Date().toISOString().slice(0,10)}.json`); };
  document.getElementById('verImport').onclick=()=>document.getElementById('verFile').click();
  document.getElementById('verFile').onchange=e=>{ const fl=e.target.files[0]; if(!fl) return; fl.text().then(tx=>{ try{ const o=JSON.parse(tx); delete o['(current settings)']; Object.assign(mem,o); persist(); renderVersions(); }catch(err){ document.getElementById('verNote').textContent='That file could not be read.'; } }); };
  renderVersions(); sync();
}
function sync(){ refs.forEach(f=>f()); }

/* ============ SAVED VERSIONS (kept in this browser) ============ */
let mem={};
function loadVersions(){ try{ const v=JSON.parse(localStorage.getItem('meme10_versions_v2')||'null'); if(v) mem=v; }catch(e){} }
function persist(){ try{ localStorage.setItem('meme10_versions_v2',JSON.stringify(mem)); }catch(e){ const n=document.getElementById('verNote'); if(n) n.textContent='Saving is blocked in this browser, so versions last only until you close the page.'; } }
function saveVersion(){
  const n=document.getElementById('verName').value.trim(); if(!n) return;
  mem[n]={layout:cur,S:Object.assign({},S),G:JSON.parse(JSON.stringify(G)),M:JSON.parse(JSON.stringify(M)),links:[...LINKS]}; persist(); document.getElementById('verName').value=''; renderVersions();
}
function renderVersions(){
  const l=document.getElementById('verList'); if(!l) return; l.innerHTML='';
  const names=Object.keys(mem);
  if(!names.length){ l.innerHTML='<div class="hint">No saved versions yet.</div>'; return; }
  names.forEach(n=>{
    const r=document.createElement('div'); r.className='ver';
    r.innerHTML=`<span></span><button>Load</button><button>Delete</button>`;
    r.firstChild.textContent=`${n}  ·  ${(LAYOUTS[mem[n].layout]||{}).tab||''}`;
    r.children[1].onclick=()=>{ const v=mem[n]; S=Object.assign({},SHARED_DEFAULTS,v.S);
      Object.keys(LAYOUTS).forEach(k=>G[k]=Object.assign({},LAYOUTS[k].geo,(v.G||{})[k]));
      if(v.M) M=JSON.parse(JSON.stringify(v.M)); cur=LAYOUTS[v.layout]?v.layout:'1b'; LINKS=new Set(v.links||[]); sel=null; buildPanel(); render(); };
    r.children[2].onclick=()=>{delete mem[n];persist();renderVersions();};
    l.appendChild(r);
  });
}

/* ============ RENDER + EXPORT ============ */
let LAST={W:649,H:289,svg:''};
function render(){
  LAST=LAYOUTS[cur].build(S,G[cur]);
  document.getElementById('canvas').innerHTML=LAST.svg; autosave(); overlay();
  const mw=document.getElementById('menuWarn'); if(mw) mw.textContent=LAST.over?'The menu is longer than the page. Make the text smaller or use 2 columns.':'';
  document.getElementById('pageStyle').textContent=`@page{size:${f(LAST.W)}px ${f(LAST.H)}px;margin:0}@media print{html,body{margin:0;height:auto}.app,.stage,.canvas{height:${f(LAST.H)}px!important;overflow:hidden}.canvas svg{width:${f(LAST.W)}px!important;height:${f(LAST.H)}px!important}}`;
}
const fileBase=()=>'meme-on-10-'+LAYOUTS[cur].file+'-logo_'+VERSION_DATE;
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
document.getElementById('gd').onchange=overlay;
document.getElementById('btnSvg').onclick=()=>download(new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+LAST.svg],{type:'image/svg+xml'}),fileBase()+'.svg');
document.getElementById('btnPdf').onclick=()=>{ const old=document.title; document.title=fileBase(); window.print(); setTimeout(()=>document.title=old,500); };
document.getElementById('btnPng').onclick=()=>{
  const scale=3, img=new Image();
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=LAST.W*scale; c.height=LAST.H*scale; c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>download(b,fileBase()+'.png')); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LAST.svg.replace(FONT_CSS,faceCSS(Object.keys(FONTS))+FONT_CSS));
};


/* ============ CLICK TO SELECT · ARROW KEYS · + / − ============ */
const ELKEYS={wm:['wmX','wmY'],on:['onX','onY'],sq:['sqX','sqY'],tag:['tagX','tagY'],oval:[]};
const ELNAME={wm:'Wordmark',on:'“on 10”',sq:'Squiggle',tag:'Tagline',oval:'Oval'};
function svgEl(){ return document.querySelector('#canvas svg'); }
function boxOf(el,svg){ const r=el.getBoundingClientRect(), s=svg.getBoundingClientRect(), k=LAST.W/s.width;
  return {x:(r.left-s.left)*k,y:(r.top-s.top)*k,w:r.width*k,h:r.height*k}; }
function centersOf(svg,skip){ const o={}; svg.querySelectorAll('[data-el]').forEach(el=>{ const k=el.dataset.el; if(k==='oval'||k===skip) return; const b=boxOf(el,svg); o[k]={x:b.x+b.w/2,y:b.y+b.h/2,b}; }); return o; }
function line(svg,x1,y1,x2,y2,col,w,dash,op){ const l=document.createElementNS(NS,'line'); [['x1',x1],['y1',y1],['x2',x2],['y2',y2],['stroke',col],['stroke-width',w],['pointer-events','none'],['data-ui','1']].forEach(([a,v])=>l.setAttribute(a,v)); if(dash) l.setAttribute('stroke-dasharray',dash); if(op) l.setAttribute('opacity',op); svg.appendChild(l); }
function overlay(){
  document.querySelectorAll('#canvas [data-ui]').forEach(n=>n.remove());
  document.querySelectorAll('#panel .acc').forEach(a=>a.classList.toggle('sel',!!sel&&a.dataset.sec===sel));
  const info=document.getElementById('selInfo'); if(info) info.textContent='';
  const svg=svgEl(); if(!svg) return;
  const k=LAST.W/svg.getBoundingClientRect().width, W=LAST.W, H=LAST.H, gd=document.getElementById('gd').checked;
  const MAG='#e0409a';
  if(gd){ line(svg,W/2,0,W/2,H,MAG,1*k,`${6*k} ${5*k}`,.55); line(svg,0,H/2,W,H/2,MAG,1*k,`${6*k} ${5*k}`,.55); }
  if(!sel) return;
  const el=svg.querySelector(`[data-el="${sel}"]`); if(!el) return;
  const b=boxOf(el,svg), p=4, cxs=b.x+b.w/2, cys=b.y+b.h/2;
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('x',b.x-p*k); r.setAttribute('y',b.y-p*k); r.setAttribute('width',b.w+2*p*k); r.setAttribute('height',b.h+2*p*k);
  r.setAttribute('fill','none'); r.setAttribute('stroke','#1f6fd1'); r.setAttribute('stroke-width',1.5*k); r.setAttribute('stroke-dasharray',`${5*k} ${4*k}`); r.setAttribute('pointer-events','none'); r.setAttribute('data-ui','1');
  svg.appendChild(r);
  {
    const tol=0.8*k*2, oth=centersOf(svg,sel);
    const xs=[['canvas',W/2],...Object.entries(oth).map(([n,o])=>[n,o.x])], ys=[['canvas',H/2],...Object.entries(oth).map(([n,o])=>[n,o.y])];
    xs.forEach(([n,x])=>{ if(Math.abs(x-cxs)<tol) line(svg,x,0,x,H,MAG,1.6*k,null,1); });
    ys.forEach(([n,y])=>{ if(Math.abs(y-cys)<tol) line(svg,0,y,W,y,MAG,1.6*k,null,1); });
  }
  if(info){ const [kx,ky]=ELKEYS[sel]; const bits=[ELNAME[sel]]; if(kx in G[cur]) bits.push('X '+G[cur][kx]); if(ky in G[cur]) bits.push('Y '+G[cur][ky]);
    const dx=Math.round((cxs-W/2)*10)/10; bits.push(dx===0?'centered across':'from center '+dx); info.textContent=bits.join(' · '); }
}
function pick(ev){
  const svg=svgEl(); if(!svg||cur==='mn') return null;
  const s=svg.getBoundingClientRect(), k=LAST.W/s.width, px=(ev.clientX-s.left)*k, py=(ev.clientY-s.top)*k, sl=6*k;
  let best=null,area=1e18;
  svg.querySelectorAll('[data-el]').forEach(el=>{
    const n=el.dataset.el; let hit=false, a=0;
    const b=boxOf(el,svg);
    if(n==='oval'){            // only the line itself, not the empty space inside it
      const cx=b.x+b.w/2, cy=b.y+b.h/2, rx=b.w/2, ry=b.h/2, d=Math.hypot((px-cx)/rx,(py-cy)/ry);
      const tolN=(10*k)/Math.min(rx,ry); hit=Math.abs(d-1)<tolN; a=1e17;
    } else if(n==='tag'&&el.getNumberOfChars){   // follow the letters, even when the line is curved
      for(let i=0;i<el.getNumberOfChars()&&!hit;i++){ const r=el.getExtentOfChar(i); if(r.width&&px>=r.x-sl&&px<=r.x+r.width+sl&&py>=r.y-sl&&py<=r.y+r.height+sl) hit=true; }
      a=1e6;
    } else { hit=px>=b.x-sl&&px<=b.x+b.w+sl&&py>=b.y-sl&&py<=b.y+b.h+sl; a=b.w*b.h; }
    if(hit&&a<area){area=a;best=n;}
  });
  return best;
}
// selecting a part opens its section in the sidebar (and closes the others)
function selectEl(k){
  sel=k;
  if(k){
    const acc=panel.querySelector(`.acc[data-sec="${k}"]`);
    if(acc){
      if(!OPEN[cur]) OPEN[cur]=new Set();
      panel.querySelectorAll('.acc.open').forEach(a=>{ if(a!==acc){ a.classList.remove('open'); a.querySelector('.acc-h').setAttribute('aria-expanded',false); OPEN[cur].delete(a.dataset.sec); } });
      acc.classList.add('open'); acc.querySelector('.acc-h').setAttribute('aria-expanded',true); OPEN[cur].add(k);
      requestAnimationFrame(()=>acc.scrollIntoView({block:'nearest',behavior:'smooth'}));
    }
  }
  overlay();
}
const PARTS=['oval','wm','on','sq','tag'];
const SIZEKEY={wm:['wmScale'],on:['onScale'],sq:['sqScale'],tag:['tagSize'],oval:['rx','ry']};
function partsHere(){ const svg=svgEl(); return svg?PARTS.filter(p=>svg.querySelector(`[data-el="${p}"]`)):[]; }
function resizeSel(m){
  (SIZEKEY[sel]||[]).filter(k=>k in G[cur]).forEach(k=>{
    const sp=rangeOf(cur,k), step=sp?sp[5]:1, old=G[cur][k];
    let v=old+m*step; if(sp) v=Math.min(sp[4],Math.max(sp[3],v)); v=Math.round(v*1000)/1000;
    G[cur][k]=v; propagate(k,old,v);
  });
  render(); sync();
}
(function(){
  // no dragging: clicking a part only selects it; the keyboard moves it
  const cv=document.getElementById('canvas');
  cv.addEventListener('pointerdown',ev=>{ selectEl(pick(ev)); ev.preventDefault(); });
  document.addEventListener('keydown',ev=>{
    const tg=ev.target.tagName; if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA') return;
    if(cur==='mn'||ev.metaKey||ev.ctrlKey) return;
    if(ev.key==='Tab'&&sel){ const ps=partsHere(); if(!ps.length) return; ev.preventDefault();
      const i=ps.indexOf(sel); selectEl(ps[(i+(ev.shiftKey?-1:1)+ps.length)%ps.length]); return; }
    if(!sel) return;
    if(ev.key==='Escape'){ selectEl(null); return; }
    if(['Equal','Minus','NumpadAdd','NumpadSubtract'].includes(ev.code)){ ev.preventDefault();
      resizeSel(((ev.code==='Equal'||ev.code==='NumpadAdd')?1:-1)*(ev.shiftKey?10:1)); return; }
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key]; if(!d) return;
    const [kx,ky]=ELKEYS[sel]; const n=ev.shiftKey?10:1; let ch=false;
    const mv=(key,by)=>{ G[cur][key]=Math.round((G[cur][key]+by)*100)/100; ch=true; };
    if(kx&&kx in G[cur]&&d[0]) mv(kx,d[0]*n); if(ky&&ky in G[cur]&&d[1]) mv(ky,d[1]*n);
    if(ch){ ev.preventDefault(); render(); sync(); }
  });
})();
// the controls sidebar can be made wider or narrower (drag its left edge; double-click to reset)
(function(){
  const g=document.getElementById('grip'), root=document.documentElement, MIN=320, DEF=420;
  const max=()=>Math.max(MIN,Math.min(1000,window.innerWidth-380));
  const now=()=>parseInt(getComputedStyle(root).getPropertyValue('--side'))||DEF;
  const setW=w=>{ root.style.setProperty('--side',Math.round(Math.min(max(),Math.max(MIN,w)))+'px'); };
  const save=()=>{ try{ localStorage.setItem('meme10_side',now()); }catch(e){} };
  try{ const w=+localStorage.getItem('meme10_side'); if(w) setW(w); }catch(e){}
  let drag=false;
  g.addEventListener('pointerdown',e=>{ drag=true; g.setPointerCapture(e.pointerId); g.classList.add('on'); document.body.classList.add('resizing'); e.preventDefault(); });
  g.addEventListener('pointermove',e=>{ if(drag){ setW(window.innerWidth-e.clientX-4); overlay(); } });
  const end=()=>{ if(!drag) return; drag=false; g.classList.remove('on'); document.body.classList.remove('resizing'); save(); overlay(); };
  g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',()=>{ root.style.removeProperty('--side'); try{ localStorage.removeItem('meme10_side'); }catch(e){} overlay(); });
  g.addEventListener('keydown',e=>{ const d={ArrowLeft:20,ArrowRight:-20}[e.key]; if(!d) return; e.preventDefault(); e.stopPropagation(); setW(now()+d); save(); overlay(); });
  window.addEventListener('resize',()=>{ if(now()>max()) setW(max()); overlay(); });
})();

function autosave(){ try{ localStorage.setItem('meme10_last',JSON.stringify({cur,S,G,M,mode,menuMode,links:[...LINKS]})); }catch(e){} }
function restore(){ try{ const v=JSON.parse(localStorage.getItem('meme10_last')||'null'); if(!v) return;
  S=Object.assign({},SHARED_DEFAULTS,v.S); Object.keys(LAYOUTS).forEach(k=>G[k]=Object.assign({},LAYOUTS[k].geo,(v.G||{})[k])); if(LAYOUTS[v.cur]) cur=v.cur; LINKS=new Set(v.links||[]); if(v.mode) mode=v.mode; if(v.M) M=v.M; if(['text','docs','sheet','boxes'].includes(v.menuMode)) menuMode=v.menuMode; }catch(e){} }
restore(); loadVersions();
{ const h=decodeURIComponent(location.hash.slice(1)); if(h==='menu') cur='mn'; else if(LAYOUTS[h]) cur=h; else if(h==='logo' && cur==='mn') cur='1b'; }
buildPanel(); render();
if(document.fonts){
  const loaded=()=>[...document.fonts].filter(f=>f.status==='loaded').length;
  let seen=loaded(), timer=null;
  const again=()=>{ clearTimeout(timer); timer=setTimeout(()=>{ const n=loaded(); if(n!==seen){ seen=n; render(); } },120); };
  document.fonts.ready.then(again); document.fonts.onloadingdone=again;
}
</script>
