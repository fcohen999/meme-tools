<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mémé on 10 – Horizontal Logo Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Libre+Bodoni:wght@400;500;600&family=DM+Serif+Display&family=Prata&family=Playfair+Display:wght@400;500&family=Jost:wght@400;500&family=Figtree:wght@400;500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style id="pageStyle"></style>
<style>
/* ---- the page around the panel: canvas, export bar, sidebar edge (the panel itself is styled in panel-css below) ---- */
:root{--ink:#2b2724;--muted:#6b635b;--line:#d9d1c6;--panel:#f6f2ea;--accent:#b35a3e;--sel:#1f6fd1;color-scheme:light}   /* the editor is always light, even when the computer is in dark mode */
*{box-sizing:border-box}
body{margin:0;background:#ece7df;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px}
input,select,textarea{color:var(--ink);background-color:#fff}
.app{display:grid;grid-template-columns:minmax(0,1fr) 7px var(--side,420px);min-height:100vh}
.stage{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px;gap:14px}
.canvas{flex:1;display:flex;align-items:center;justify-content:center;background:#e3ddd2;border-radius:6px;padding:24px;overflow:hidden;outline:none}
.canvas svg{cursor:default;max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:2px 0}
.bar button{font:inherit;font-size:13px;border:1px solid #b9b0a5;background:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.bar button:hover{background:#efe9df}
.bar button.primary{background:var(--ink);color:#f3ede1;border-color:var(--ink)}
.bar button.primary:hover{background:var(--accent);border-color:var(--accent)}
.bar :is(button,input):focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.bar .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.bar label{color:var(--muted)}
/* the sheet row (one menu or two halves) in the bar under the menu page; it uses the panel's controls */
.bar .paperbar{background:none;flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:0 0 6px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.bar .paperbar[hidden]{display:none}
.bar .paperbar .row2{display:flex;gap:8px;margin:0;min-height:0}
.bar .paperbar .row2 .seg.small{width:auto}
.bar .paperbar .row2 .seg.small button{flex:none;padding:5px 12px}
.bar .paperbar .row2 select{width:auto;max-width:220px}
.bar .paperbar .row2>label,.bar .paperbar .lab label{color:var(--ink);font-weight:600}
.bar .paperbar .checkrow{margin:0}
.bar .paperbar .checkrow span{color:var(--ink)}
.bar .paperbar .hint{flex-basis:100%}
/* Page header: “Header comes from” as two small cards, each with a picture of its header */
.panel .srcpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .srcpick button{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px 8px;font-size:12px;text-align:left;border:1px solid var(--line);border-radius:6px;background:#fff}
.panel .srcpick button svg{height:30px;margin-top:0!important;border:none!important;background:var(--soft)}
.panel .srcpick button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);font-weight:600}
.panel .srcpick button.on>span::before{content:'✓ '}
/* a middling choice stays beside its label, and moves under it when the panel is narrow */
.panel .acc:not([data-sec=words]) .acc-b{container-type:inline-size}
@container (max-width:430px){
  .panel .row2.fit{grid-template-columns:1fr;gap:6px}
  .panel .row2.fit .seg.small{width:auto;justify-self:start}
  .panel .row2.fit .seg.small button{flex:none;padding-left:12px;padding-right:12px}
}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
#selInfo{font-variant-numeric:tabular-nums}
.panel{padding:20px 22px 60px;overflow:auto;max-height:100vh}
.grip{position:sticky;top:0;height:100vh;cursor:col-resize;border-left:1px solid var(--line);background:var(--panel);touch-action:none;outline:none}
.grip:hover,.grip.on,.grip:focus-visible{background:#d9d1c6;border-left-color:#b9b0a5}
body.resizing{cursor:col-resize;user-select:none}
/* the page fits the window: the top nav, then the canvas and the sidebar side by side, each scrolling on its own */
@media(min-width:901px){
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .gnav{flex:none}
  .app{flex:1;min-height:0}
  .stage,.grip{position:static;height:auto;min-height:0}
  .panel{max-height:none;min-height:0}
}
@media(max-width:900px){.app{grid-template-columns:1fr}.grip{display:none}.stage{position:static;height:auto}.canvas{min-height:300px}.panel{max-height:none}}
@media(max-width:480px){.panel{padding:16px 14px 48px}}
/* Simple: fewer controls, bigger targets */
body.simple .only-full{display:none!important}
body.simple #btnPdf{font-size:16px;padding:12px 22px}
body.simple .panel .row2>label,body.simple .panel .lab label,body.simple .panel .checkrow{font-size:14px}
body.simple .panel .stepper .sb{width:40px;height:34px}
body.simple .panel .stepper .unit{right:46px;line-height:34px}
@media(max-width:480px){body.simple .panel .stepper .sb{width:34px}body.simple .panel .stepper .unit{right:40px}}
/* editor-only bits inside the panel */
.panel .steps{padding-left:20px;margin:12px 0 10px;line-height:1.7;font-size:14px}.panel .steps li{margin:6px 0}.panel .steps button{padding:4px 10px}
.panel .pastebox{width:100%;min-height:150px;font:13px ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:6px;resize:vertical;background:#fff}
.panel #menuModes.menuseg{display:grid;grid-template-columns:repeat(2,1fr);width:100%}
.panel .mmodehint{margin:6px 0 0;font-size:13px}
.panel .mtips{margin:6px 0 0}.panel .mtips summary{cursor:pointer}.panel .mtips p{margin:6px 0 0;line-height:1.5}
.panel .menuseg button{padding:8px 4px;font-size:12.5px;line-height:1.25}
.panel .mcard{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:12px;margin:12px 0}
.panel .mcard .mk{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.panel .mgrid{display:grid;grid-template-columns:1fr 76px;gap:8px}
.panel .mgrid .fl{font-size:11px;color:var(--muted);margin-bottom:-4px}
.panel .mdish{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.panel .mdish textarea{font-size:13px;margin-top:6px}
.panel .mcard .ver button{padding:4px 9px;font-size:12px}
@media print{
  body{background:none;display:block;height:auto;overflow:visible}
  .app{display:block;min-height:0}.panel,.bar,.hint,.grip,.gnav,#canvas [data-ui]{display:none!important}
  .stage{position:static;height:auto;padding:0}
  .canvas{background:none;padding:0;border-radius:0;display:block}
  .canvas svg{max-width:none;max-height:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ---- Menu tab: the “Your menus” bar (always visible, not a section) and the small ⋯ menus ---- */
.panel .mbar{display:flex;align-items:center;gap:8px;margin:16px 0 6px;padding:8px 8px 8px 12px;background:var(--hover);border:1px solid var(--line);border-radius:var(--radius)}
.panel .mbar .mbl{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none}
.panel .mbar select{flex:1;min-width:0;height:34px;font-size:14px;font-weight:600;border:1px solid var(--edge);border-radius:6px;background:#fff;color:var(--ink);padding:0 8px}
.panel .mbar .msave{flex:none;height:34px;border:none;border-radius:6px;background:var(--ink);color:#f3ede1;font-weight:600;padding:0 12px;white-space:nowrap}
.panel .mbar .msave:hover{background:#000}
.panel .mbar .dots{flex:none;width:34px;height:34px;padding:0;border:1px solid var(--edge);border-radius:6px;background:#fff;color:var(--ink);font-size:18px;line-height:1}
.panel .mbar .dots:hover{background:var(--soft)}
.panel .mbar-sub{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12px;color:var(--muted);margin:0 2px 14px}
.panel .mbar-sub .mhist{display:inline-flex;gap:6px;margin-right:4px}
.panel .mbar-sub .mhist button{height:30px;padding:0 10px;font-size:13px;font-weight:600}
.panel .mbar-sub details{display:inline}.panel .mbar-sub summary{cursor:pointer;text-decoration:underline;display:inline}
.panel .mbar-sub details[open]{display:block;flex-basis:100%}.panel .mbar-sub details p{margin:6px 0 0;line-height:1.5}
.panel .mbar-sub .mst{color:var(--ok);font-weight:600;transition:opacity .6s}
.panel .mform{display:flex;gap:6px;margin:-2px 0 12px}.panel .mform input{flex:1;min-width:0}
.panel .mcard .dots,.panel .mdish .dots{flex:none;width:30px;height:30px;padding:0;font-size:17px;line-height:1;color:var(--muted)}
.panel .mcard .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.panel .mcard .mhead .mk{margin:0}
.panel .mdish .mrow{display:grid;grid-template-columns:1fr 76px 30px;gap:8px;align-items:center}
.panel .madd{margin-top:10px}
.panel .madds{display:flex;flex-wrap:wrap;gap:8px}
.panel .marrows{display:inline-flex;gap:2px}
.panel .marrows button{width:30px;height:30px;padding:0;font-size:15px;line-height:1;color:var(--muted)}
.panel .mtools{display:inline-flex;gap:6px;align-items:center}
.panel .mcard.mtop{background:var(--hover)}
/* Boxes: each section is its own tinted block with a dark heading bar (it stays in view while you scroll its dishes); each dish is a white card inside it */
.panel .mcard.msec{background:var(--hover);border:1px solid var(--edge);padding:0 8px 12px;margin:26px 0}
.panel .mcard.msec>.mhead{position:sticky;top:0;z-index:3;background:var(--ink);color:#fff;margin:0 -8px 10px;padding:8px 8px 8px 12px;border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;gap:10px}
.panel .mcard.msec>.mhead .mk{color:#cfc5b8;flex:none}
.panel .mcard.msec>.mhead button{background:#fff}.panel .mcard.msec>.mhead button:disabled,.panel .mcard.msec>.mhead button:disabled:hover{opacity:1;background:transparent;border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.3)}
.panel .mcard.msec>.mhead .mname{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .mcard.msec>.mhead .mname:empty::before{content:'(no name yet)';font-weight:400;opacity:.6}
.panel .mcard.msec .mdish{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px}
.panel .mcard.msec .mdish.msub{background:var(--soft);border-left:3px solid var(--accent);margin-top:16px}
.panel .mcard.msec>.madds{margin-top:4px}
.panel .acc:has(#menuEditor){overflow:visible}
/* folding: the bar opens and closes its section; a closed one shows a one-line list of its dishes */
.panel .mcard.msec>.mhead .mfold{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;color:inherit;padding:4px 0;text-align:left;cursor:pointer;font:inherit}
.panel .mcard.msec>.mhead .mfold:hover{background:none}
.panel .mcard.msec>.mhead .mchev{flex:none;display:inline-block;width:12px;font-size:11px;color:#cfc5b8;transition:transform .15s}
.panel .mcard.msec:not(.shut)>.mhead .mchev{transform:rotate(90deg)}
.panel .mcard.msec.shut{padding-bottom:0}
.panel .mcard.msec.shut>.mhead{position:static;border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;margin-bottom:0}
.panel .mcard.msec.shut>.mbody{display:none}
.panel .mcard.msec>.msum{display:none;width:calc(100% + 16px);margin:0 -8px;padding:9px 12px 10px;background:none;border:none;text-align:left;font:inherit;font-size:12.5px;line-height:1.45;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .mcard.msec>.msum:hover{background:none;color:var(--ink)}
.panel .mcard.msec>.msum b{color:var(--ink);font-weight:600}
.panel .mcard.msec.shut>.msum{display:block}
.panel .mfoldall{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);margin:14px 0 -12px}
.panel .mfoldall button.link{font-size:12px;padding:0}
/* a dish takes only the room it needs: the What’s-in-it box is one line until you type more */
.panel .mdish .mrow.nopr{grid-template-columns:1fr 30px}
.panel .mcard.msec .mdish textarea{resize:none;overflow:hidden;min-height:0;padding:5px 8px}
/* drag to reorder: the ⠿ handle on the left of each dish and subheading */
.panel .mdish .mrow.mdrag{grid-template-columns:16px 1fr 76px 30px}
.panel .mdish .mrow.mdrag.nopr,.panel .mdish .mrow.mdrag.sub{grid-template-columns:16px 1fr 30px}
.panel .mdish .mrow.mdrag~textarea{margin-left:24px;width:calc(100% - 24px)}
.panel .mdish .mrow.mdrag~.mrow.mopt{padding-left:40px}
.panel .mdish .mrow.mdrag~.mcols,.panel .mdish .mrow.mdrag~button.madd-opt{margin-left:24px}
.panel .mgrip{width:16px;height:30px;padding:0;border:none;background:none;color:#a39a8f;font-size:15px;line-height:30px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.panel .mgrip:hover{background:none;color:var(--ink)}
.panel .mdish.mdragging{opacity:.35}
.mghost{position:fixed;z-index:1000;pointer-events:none;background:#fff;border:1px solid #b9b0a5;border-radius:6px;padding:8px 12px;font:600 14px "Helvetica Neue",Helvetica,Arial,sans-serif;color:#2b2724;box-shadow:0 8px 24px rgba(0,0,0,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;transform:rotate(-1deg)}
.mdropline{position:fixed;z-index:999;height:3px;border-radius:2px;background:#1f6fd1;pointer-events:none}
.panel .mcard.msec.mdropin{outline:3px solid #1f6fd1;outline-offset:-1px}
body.mdragnow,body.mdragnow *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}   /* or the section bars could not stay in view while scrolling */
.panel .mcols{display:flex;align-items:center;gap:10px;margin-top:8px}.panel .mcols .fl{margin:0}
.panel .mdish .mrow.sub{grid-template-columns:1fr 30px}
.panel .mdish .mrow.mopt{margin-top:6px;padding-left:16px;grid-template-columns:1fr 76px 30px}
.panel .mdish .mopt input{font-size:13px!important}
.panel .mdish button.madd-opt{margin-top:2px;padding:4px 0 0 16px;font-size:12px;color:var(--muted);text-decoration:none}.panel .mdish button.madd-opt:hover{color:var(--sel);text-decoration:underline}
.panel .msub>.fl{margin-bottom:4px}
.panel .mcols .fl,.panel .msub>.fl{font-size:11px;color:var(--muted)}
/* the row a selected line on the menu page belongs to lights up for a moment */
.panel .row2.flash{animation:rowflash 1.8s ease-out;border-radius:6px}
@keyframes rowflash{0%,30%{background:#dbe8fb;box-shadow:0 0 0 6px #dbe8fb}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
#canvas:focus{outline:none}
.popmenu{position:fixed;z-index:100;list-style:none;margin:0;padding:4px;background:#fff;border:1px solid #d9d1c6;border-radius:8px;box-shadow:0 8px 24px rgba(43,39,36,.16);min-width:210px;font:14px "Helvetica Neue",Helvetica,Arial,sans-serif}
.popmenu button{display:block;width:100%;text-align:left;border:none;border-radius:5px;background:none;padding:8px 10px;font:inherit;color:#2b2724;cursor:pointer}
.popmenu button:hover,.popmenu button:focus-visible{background:#efe9df;outline:none}
.popmenu button:disabled{color:#b9b0a5;cursor:default;background:none}
.popmenu .danger{color:#b35a3e}.popmenu .danger.armed{background:#b35a3e;color:#fff}
.popmenu hr{border:none;border-top:1px solid #e3dccf;margin:4px 2px}
</style>
<!-- panel-css:start -->
<style id="panel-css">
/* The editing panel: one look for every tool (logo and menu editor, social post maker).
   This block is the same in editor.html and social.html. Edit it in editor.html, then run
   python3 tools/sync-panel.py to copy it across (add --check to only compare). */
.panel{--ink:#2b2724;--muted:#6b635b;--line:#d9d1c6;--edge:#b9b0a5;--panel:#f6f2ea;--hover:#efe9df;--soft:#faf7f1;--accent:#b35a3e;--sel:#1f6fd1;--ok:#3f6b35;--bad:#b35a3e;--ctl:164px;--radius:8px;
  background:var(--panel);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:normal;min-width:0;color-scheme:light}
.panel *{box-sizing:border-box}
/* buttons and fields */
.panel button{font:inherit;font-size:13px;border:1px solid var(--edge);background:#fff;border-radius:4px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.panel button:hover{background:var(--hover);color:var(--ink)}
.panel button.primary{background:var(--ink);color:#f3ede1;border-color:var(--ink)}
.panel button.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.panel button.danger{color:var(--accent);border-color:#d8b4a8}
.panel button.danger:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.panel button:disabled{opacity:.35;cursor:default}
.panel button:disabled:hover{background:#fff}
.panel button.link{background:none;border:none;color:var(--sel);padding:4px 0;font-size:13px;text-decoration:underline}
.panel button.link:hover{background:none;color:#1a58a6}
.panel button.armed,.panel button.link.armed{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;text-decoration:none;padding:6px 10px}
.panel :is(button,select,input,textarea,a,summary):focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.panel input,.panel select,.panel textarea{color:var(--ink);background-color:#fff}
.panel :is(input,textarea)::placeholder{color:#9a9188}
.panel select,.panel input[type=text],.panel textarea{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:3px;width:100%}
.panel :is(select,input[type=text],input[type=number],textarea):hover{border-color:var(--edge)}
.panel textarea{line-height:1.5;padding:8px;resize:vertical}
.panel a{color:var(--sel)}
.panel .hint{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.panel .status{font-size:12px;font-weight:600;min-height:1.2em;margin:0}
.panel .ok,.panel .status.ok{color:var(--ok)}.panel .bad,.panel .status.bad{color:var(--bad)}
/* title row: name of the tool, a line under it, and (in the editor) the Simple switch */
.panel .titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel .titlerow :is(h1,h2){font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
.panel .titlerow :is(h1,h2) small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px;letter-spacing:0}
.panel .switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.panel .switch input{position:absolute;opacity:0;width:1px;height:1px}
.panel .switch .track{width:36px;height:20px;border-radius:10px;background:#c9c0b4;position:relative;transition:background .15s}
.panel .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.panel .switch input:checked+.track{background:var(--ink)}
.panel .switch input:checked+.track .knob{left:18px}
.panel .switch input:focus-visible+.track{outline:2px solid var(--sel);outline-offset:2px}
/* "what are you making" picker under the title */
.panel .kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.panel .lgroups{display:flex;flex-wrap:wrap;gap:10px 16px}
.panel .lgl{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-bottom:5px}
.panel .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--edge);border-radius:6px;overflow:hidden;background:#fff;max-width:100%}
.panel .seg button{border:none;border-radius:0;border-right:1px solid #e3dccf;padding:8px 12px;background:#fff}
.panel .seg button:last-child{border-right:none}
.panel .seg button small{font-size:10px;opacity:.6;margin-left:5px}
.panel .seg button:is(.on,[aria-pressed="true"],[aria-selected="true"]){background:var(--ink);color:#f3ede1}
.panel .seg button:not(.on):not([aria-pressed="true"]):not([aria-selected="true"]):hover{background:var(--hover);color:var(--ink)}
.panel .seg.small button{padding:5px 10px;min-height:28px;font-size:12px}
/* help box */
.panel .helpbox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:13px;line-height:1.55;color:var(--muted);margin:16px 0 6px}
.panel .helpbox b{color:var(--ink)}
.panel .helpbox p{margin:0 0 6px;color:var(--ink)}
.panel .helpbox ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.panel .helpbox li{display:contents}
.panel .helpbox li>span:first-child{white-space:nowrap}
.panel kbd{display:inline-block;min-width:20px;padding:1px 5px;font:600 11px/16px ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--ink);background:var(--soft);border:1px solid #cfc6b9;border-bottom-width:2px;border-radius:4px}
.panel .inlock{display:inline-block;width:13px;height:13px;vertical-align:-2px}.panel .inlock svg{width:13px;height:13px}
/* sections that open and close */
.panel .acc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.panel .acc-h{width:100%;display:flex;align-items:center;gap:10px;border:none;border-radius:0;background:none;padding:10px 14px;min-height:42px;font-size:14px;font-weight:600;text-align:left}
.panel .acc-h:hover{background:var(--soft);color:var(--ink)}
.panel .chev{width:15px;height:15px;flex:none;transition:transform .15s;color:var(--muted)}
.panel .acc.open .chev{transform:rotate(90deg)}
.panel .acc-t{flex:1}
.panel .acc-sum{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.panel .acc-sum .dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.panel .acc-badge{display:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;background:var(--sel);color:#fff;border-radius:10px;padding:2px 8px}
.panel .acc.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.panel .acc.sel .acc-badge{display:inline}
.panel .acc.sel .acc-sum{display:none}
.panel .acc-b{display:none;padding:4px 14px 14px;border-top:1px solid var(--line)}
.panel .acc.open .acc-b{display:block}
.panel .acc-b>.hint{margin:2px 0 8px;font-size:11.5px}
/* a longer help line: one line until it is clicked */
.panel .hint.tip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.panel .hint.tip:hover{color:var(--ink)}
.panel .hint.tip.open{white-space:normal;cursor:default}
/* a small heading inside a section */
.panel .sub{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.panel .sub::after{content:'';flex:1;height:1px;background:var(--line)}
.panel .acc-b>.sub:first-child{margin-top:10px}
/* setting rows: label on the left, every control the same width on the right (a third column holds the link button).
   The control column grows a little with the panel, so labels and controls stay close on a wide panel. */
.panel .row2{--cw:clamp(var(--ctl),40%,240px);display:grid;grid-template-columns:minmax(0,1fr) var(--cw) 26px;gap:10px;align-items:center;margin:4px 0;min-height:30px}
.panel .row2.two{grid-template-columns:minmax(0,1fr) var(--cw)}
.panel .row2.stack{grid-template-columns:1fr;gap:6px}
.panel .row2>label,.panel .lab label{font-size:13px;line-height:1.3}
.panel .lab{display:flex;align-items:center;gap:4px;min-width:0}
.panel .reset{visibility:hidden;flex:none;width:20px;height:20px;padding:0;border:none;border-radius:50%;background:none;color:var(--muted);font-size:13px;line-height:20px}
.panel .reset.on{visibility:visible}
.panel .reset:hover{background:var(--hover);color:var(--ink)}
.panel .row2 select{width:100%}
.panel .row2.stack select{width:100%}
.panel .row2 .seg.small{width:100%;display:flex}
.panel .row2 .seg.small button{flex:1;white-space:nowrap;padding-left:6px;padding-right:6px}
/* a choice too long for the control column sits under its label, only as wide as its words */
.panel .row2.stack .seg.small{width:auto;justify-self:start}
.panel .row2.stack .seg.small button{flex:none;padding-left:12px;padding-right:12px}
.panel .row2.off,.panel .checkrow.off{opacity:.45}
.panel .row2 .why{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:-2px 0 2px}
.panel .stepper{display:flex;width:100%;position:relative;border:1px solid var(--edge);border-radius:5px;overflow:hidden;background:#fff}
.panel .stepper .sb{-webkit-tap-highlight-color:transparent;border:none;border-radius:0;padding:0;width:30px;height:28px;font-size:17px;line-height:1;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.panel .stepper .sb:hover{background:var(--hover)}
.panel .stepper .sb:active{background:#e3dccf}
.panel .stepper input{flex:1;width:0;min-width:0;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font:inherit;font-size:13px;padding:0 2px;-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums}
.panel .stepper input::-webkit-inner-spin-button,.panel .stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.panel .stepper .unit{position:absolute;right:36px;top:0;line-height:28px;font-size:11px;color:var(--muted);pointer-events:none}
.panel .stepper.has-unit input{padding-right:16px;padding-left:2px}
.panel .lock{width:24px;height:24px;padding:0;border-radius:4px;display:flex;align-items:center;justify-content:center;border-color:transparent;background:none;color:#a39a8f}
.panel .lock:hover{background:#e6dfd3;color:var(--ink)}
.panel .lock.on{background:var(--sel);border-color:var(--sel);color:#fff}
.panel .lock svg{width:14px;height:14px}
.panel .colorctl{width:100%;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:5px;background:#fff;padding:3px 8px 3px 3px;cursor:pointer}
.panel .colorctl:hover{border-color:var(--edge)}
.panel .colorctl input[type=color]{width:34px;height:24px;border:none;padding:0;background:none;cursor:pointer;flex:none}
.panel .colorctl input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.panel .colorctl input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.18);border-radius:3px}
.panel .colorctl code{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);text-transform:uppercase}
.panel .checkrow{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px;line-height:1.35;cursor:pointer}
.panel .checkrow input{accent-color:var(--ink);width:16px;height:16px;flex:none;margin:0}
/* color presets: round swatches, or labeled chips */
.panel .swl{font-size:11px;color:var(--muted);font-weight:600;margin:10px 0 2px}
.panel .sw{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 10px}
.panel .sw button{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid rgba(0,0,0,.2);overflow:hidden;position:relative;transition:transform .1s}
.panel .sw button i{position:absolute;inset:0;border-radius:50%}
.panel .sw button:hover{transform:scale(1.08)}
.panel .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.panel .chips button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;font-size:13px}
.panel .chips .dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--edge);flex:none}
.panel :is(.sw,.chips) button:is(.on,[aria-pressed="true"]){box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink);border-color:var(--ink)}
/* pieces in order (tick to show, arrows to move) */
.panel .order{margin:12px 0}
.panel .order .sl{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.panel .ord{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;margin:5px 0;padding:4px 4px 4px 10px;background:#fff;border:1px solid var(--line);border-radius:6px}
.panel .ord label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;flex:1}
.panel .ord input{accent-color:var(--ink);margin:0}
.panel .ord .n{display:inline-block;width:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel .ord button{width:30px;height:28px;padding:0;border-color:transparent;background:none;color:var(--muted)}
.panel .ord button:not(:disabled):hover{background:var(--hover);color:var(--ink)}
.panel .ord.off{background:var(--soft)}
.panel .ord.off label{color:var(--muted);text-decoration:line-through}
/* a row of small buttons, and a list with buttons on each line */
.panel .ver{display:flex;gap:6px;align-items:center;margin:6px 0}
.panel .ver>span{flex:1}
.panel .ver input[type=text]{flex:1}
.panel .ver button{padding:4px 9px;font-size:12px}
.panel .btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel .vlist{margin:8px 0;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.panel .vlist:empty{display:none}
.panel .vrow{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-top:1px solid var(--line)}
.panel .vrow:first-child{border-top:none}
.panel .vrow .vn{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel .vrow .vn small{color:var(--muted);margin-left:6px}
.panel .vrow button{padding:4px 10px;font-size:12px}
/* the bottom of the panel */
.panel .foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.panel .foot details summary{cursor:pointer}
.panel .foot details ul{padding-left:18px;margin:8px 0}
@media(max-width:900px){.panel .acc-sum{display:none}}
@media(max-width:480px){.panel{--ctl:138px}.panel .acc-b{padding:4px 10px 12px}.panel .row2{gap:8px}}
</style>

(function () {
  var nav = document.currentScript && document.currentScript.previousElementSibling;
  if (!nav || !nav.classList.contains('gnav')) nav = document.querySelector('.gnav');
  if (!nav) return;
  function mark() {
    var key = nav.getAttribute('data-page');
    // The editor holds both the menu and the logo tools; the hash says which.
    if (key === 'editor') key = location.hash === '#menu' ? 'menu' : 'logos';
    nav.querySelectorAll('.gnav-links a').forEach(function (a) {
      if (a.getAttribute('data-key') === key) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }
  mark();
  window.addEventListener('hashchange', mark);
  // The editor reads its hash only when it loads, so a link to another part
  // of the same page has to reload it.
  nav.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="#"]');
    if (!a || nav.getAttribute('data-page') !== 'editor') return;
    var href = a.getAttribute('href');
    if (href.split('#')[0] !== 'editor.html') return;
    e.preventDefault();
    location.hash = href.split('#')[1];
    location.reload();
  });
})();

const CHANGELOG=[
 ['v26 · 35','A tighter Menu panel, with every setting still there. Choices are only as wide as their words instead of long black bars, and each control sits closer to its name. Margins and price spacing show in inches (0.64 in). Page header comes right after Menu words, in the same order as the page. One menu or two side by side is now chosen in the bar under the page, beside Save as PDF, with Right half and the cutting line next to it. Longer help lines show one line: click one to read all of it. Some names are shorter: Dish prices, Section prices, Above the header, Below the header.'],
 ['v26 · 34','Menu words: two choices, Boxes and Text, with a line under them saying what each is for (pasting from Google Docs or Word goes in Text). The “Import / export” link is gone from there; Google Sheets and spreadsheet files still work, from the ⋯ next to “Save to my computer” → “Edit in Google Sheets or a spreadsheet file”, with a ← Back link. “Reset this menu to the original” is back at the bottom of the Menu page: it puts back the sample words and the starting look, and Undo brings yours back.'],
 ['v26 · 33','A tidier Menu words panel. There are two ways to change the words now: Boxes (where a first visit starts) and Text. Pasting from Google Docs or Word goes in Text and is added to the menu, as before. Google Sheets and opening or saving a spreadsheet file are under “Import / export”. Move up and Move down are in each dish’s ⋯ menu, so dish names have more room; drag the ⠿ handle to move a dish too. The “menu is too long” warning shows at the top, Tagline order moved to Page header, and the Simple switch and Reset everything button are gone from the Menu page (Simple showed the same settings there). To start the look over, use “Put the look back to how it started” in the menu’s ⋯ list.'],
 ['v26 · 32','Menu: two half pages now print on a letter sheet turned sideways (landscape), so each half is a normal 5½ × 8½ menu. The choice moved out of Look → Layout into its own section, Paper, right under the menu words: “One menu, upright” or “Two menus, sideways”.'],
 ['v26 · 31','Edit in boxes: drag a dish or subheading by the ⠿ handle on its left to put it anywhere: higher or lower in its section, or into another section. A blue line shows where it will go. Drop it on a closed section to put it at the end of that section. The panel scrolls when you drag near its top or bottom. The ↑ ↓ arrows still work for small moves, and Undo puts a drag back.'],
 ['v26 · 30','Edit in boxes: each section is now easy to tell apart and quicker to edit. Its name sits in a dark bar that stays in view while you scroll its dishes; click the bar to fold the section closed (it then shows its dishes in one line) or open it again, or use Open all / Close all. Each dish is its own white card. The “What’s in it” box is one line until you type more. In a section with a “Price for all”, dishes have no price box unless they have their own price (⋯ → Give this dish its own price). “Add a choice” is in each dish’s ⋯ menu.'],
 ['v26 · 29','Menu: a section’s price at the right edge now lines up with the right edge of its column (where the dish prices are) instead of the far edge of the page, when the section is in two columns.'],
 ['v26 · 28','Menu: a dish’s choices (like Chicken or Lamb) are now in bold Bodoni, in normal letters instead of all caps, so they stand apart from the dish names.'],
 ['v26 · 27','Menu: a dish’s choices can sit side by side on one line (Chicken 18 · Lamb 22) instead of one per line: use the One per line / Side by side buttons under its choices in Boxes, or type them on one line with “ · ” between them. A section’s own price (like Beers 10) can sit next to the section name or at the right edge, lined up with the dish prices: Look → Prices → “A section’s price”, or drag it left or right on the page.'],
 ['v26 · 26','Edit in boxes: the ↑ ↓ arrows are back on every section, dish, subheading and choice (a dish at the top or bottom of its section moves into the next one). The first box is “Menu title, under the logo”, with Left / Center / Right. The ⋯ menus keep Duplicate and Delete. This list of changes is up to date again.'],
 ['v26 · 25','Menu page: Look → Layout → Page can be “Two half pages”: two menus side by side on one sheet, each with its own header, to print and cut down the middle. The right half can be any saved menu or the same one again, with a light dashed cutting line you can turn off.'],
 ['v26 · 24','Menu: each section can have its own 1 or 2 columns. Subheadings (like “Lunch”) can go under the logo or label a group of dishes inside a section. A dish can have choices under it, each with its own price. A section’s ⋯ menu can duplicate it. Typing, Google Docs, Google Sheets and saved files keep all of these.'],
 ['v26 · 23','Menu: pasting from Google Docs adds to your menu instead of replacing it (a section with the same name is updated). Undo and Redo buttons (and Ctrl/Cmd+Z); the browser asks before you leave with unsaved changes. “Open a menu from my computer” lets you pick any file and explains the ones it can’t open.'],
 ['v26 · 22','Menu page: when you point at, drag or select a line, the note under the page also says where the same setting is in the panel (for example “also in Margins and spacing → Bottom”).'],
 ['v26 · 21','Menu page: every blue line can be dragged, including the left and right margins and the bottom margin. Click a line to select it: its setting lights up in the panel, and the arrow keys move it (Shift for 10). The line under the page says what you are moving and by how much, in Simple too.'],
 ['v26 · 20','Menu page: drag a dish price left or right on the page (all prices move together); pull it up to the names and it sits right after each name. “A dish’s own price” in Look does the same. With the Header tab’s header and its colored band, drag the bottom edge of the band (or use Header height) to make it taller or shorter. The menus bar is lighter.'],
 ['v26 · 19','Tidier Menu panel: your menus are a bar at the top (pick a menu or make a new one, Save to my computer, and ⋯ for the rest); the four ways to change the words sit in one row; Edit in boxes has one ⋯ per dish and per section instead of rows of buttons; shorter labels and help. The menu header can no longer overlap: the logo stops at the biggest size that fits beside the tagline, and says so. The Header tab warns when its pieces are wider than the header.'],
 ['v26 · 18','Menu page: margins like the Google Docs ruler (top, where the menu text starts, left and right, bottom), and you can drag the menu text or the header up and down on the page; a bigger logo now pushes the text down instead of crowding it; space between lines, dishes and sections; “Spread out to fill the page” so there is no big blank space at the bottom; menus made before this look exactly the same until you change something; text sizes in points for section names, dish names and what’s in them. “Your menus”: make a new menu (for example Desserts) without losing the others, and save a menu to your computer as a text file you can read, then open it again. The page header now says where it comes from (this page, or the Header tab), with a small picture of each, and the Header tab says when your menus use it.'],
 ['v26 · 15','Menu page header: choose “My Header” to put the header you made on the Header tab at the top of the menu (in the menu’s colors or the Header tab’s own), and “Edit the header on the Header tab” jumps there, with a button to come back.'],
 ['v26 · 13','Tidier sidebar: settings grouped under small headings, every control lines up, plainer names (for example “Hairline detail”, “CAPS”, “Style 1 / 2”), a ↺ button to put any one setting back, the colors in use shown on the Colors bar, and settings that do nothing right now are dimmed with the reason. The Background color is called “Inside the oval” on the oval logo and “Awning” on the awning. The links that repeated the top nav are gone. The export buttons always fit on screen. The Social post maker now uses this same panel.'],
 ['v26','Change the order of the pieces on every layout (for example the tagline above “mémé on 10”, or the squiggle first in a header), and hide pieces you don’t want. The header, awning and menu page can use any version of the logo: one line, the oval logo, the logo without the oval, or a saved version.'],
 ['v25','New sidebar: one view with a Simple on/off switch; every part of the logo has its own section (closed to start) that opens when you click that part; − / + buttons you can hold down instead of sliders; layouts grouped into Logo and Made with the logo. No more dragging or snapping: click a part, then use the arrow keys, + / −, Tab and Esc (the pink line still shows when things line up). The sidebar can be made wider or narrower by dragging its left edge. Menu words can now be edited in Google Sheets, pasted straight from a Google Doc or Word (headings, bold dish names and prices are read from the formatting), or saved and opened as a text file.'],
 ['v24','Brand colors: olive, navy and cream, with charcoal for text. New “Brand” color presets at the top of the list; every older preset is still there. New logos start in charcoal and olive on cream; menu text starts in charcoal. The homepage can open any layout directly.'],
 ['v23','New Menu tab: a US Letter menu page in the brand style (one-line header, basil on cream, Jost caps dish names, Bodoni descriptions, prices in basil). The words are editable by typing like a document or in boxes.'],
 ['v22','Oval and squiggle now have their own separate colors'],
 ['v21','Background color now fills only the inside of the oval; outside the oval stays clear'],
 ['v20','Starts as your official logo: black on white, same size and spacing as the official PDF (oval, mémé, on 10, squiggle, tagline)'],
 ['v19','Hand-drawn oval now keeps its original varying line thickness (matches your original logo), still stretches and thickens'],
 ['v18','Space between "on" and "10" no longer grows when "on 10" is made bigger; new slider to adjust it'],

let HAND=null;
function handShape(){

  const holder=document.createElementNS(NS,'svg'); holder.style.cssText='position:absolute;width:0;height:0;visibility:hidden'; document.body.appendChild(holder);
  const pts=d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);holder.appendChild(p);const L=p.getTotalLength(),n=720,a=[];for(let i=0;i<n;i++){const q=p.getPointAtLength(L*i/n);a.push([q.x,q.y]);}return a;};

  const outer=Math.abs(area(A))>Math.abs(area(B))?A:B, inner=outer===A?B:A, N=outer.length;

        const pg=5*sc, dot='·', dotW=measure(dot,'Bodoni Moda',400,ps,0), sep=10*sc*2+dotW, maxW=colW-optIn;

        opts.forEach(o=>{ const w=o.tw+(o.t&&o.op?pg:0)+o.opw, row=rows[rows.length-1];
          if(row.length&&x+sep+w>maxW){ rows.push([]); x=0; }
          const r2=rows[rows.length-1]; if(r2.length) x+=sep;
          r2.push({t:o.t,op:o.op,x,px:x+o.tw+(o.t?pg:0),dx:r2.length?x-sep/2:null}); x+=w; });
      }
      const descEnd=ds.length?(nm.length?toDesc:0)+(ds.length-1)*step:-Infinity;
      const nameEnd=Math.max(0,nm.length-1)*step;
      const o0=ds.length?descEnd+step:(nm.length?nameEnd+toDesc:0);
      const nOpt=rows?rows.length:opts.length;
      const lastOff=nOpt?o0+(nOpt-1)*step:Math.max(nameEnd,descEnd);
      return {nm,ds,pr,opts,rows,o0,lastOff,h:lastOff+itemGap};
    };
    // the first thing sits under the section name by the usual gap (not stretched)
    let yy=(title||price)?y+34*sc*big:y; end=y;
    // dishes between subheadings are a group; in two columns each group is split where the columns come out most even
    const runs=[]; items.forEach(it=>{ if(isSub(it)) runs.push(it); else { const r=runs[runs.length-1]; if(Array.isArray(r)) r.push(dishOf(it)); else runs.push([dishOf(it)]); } });
    runs.forEach((run,ri)=>{
      if(!Array.isArray(run)){
        // a subheading: across the whole text width, in the section-name style, a little bigger
        const lead=ri>0||title||price;
        if(lead) yy+=(ss-ns)*0.9; else if(first) yy+=Math.max(0,(ss-hs)*0.72);
        const x=run.align==='center'?(L+R)/2:run.align==='right'?R:L, anc=run.align==='center'?' text-anchor="middle"':run.align==='right'?' text-anchor="end"':'';
        out+=`<text x="${f(x)}" y="${f(yy)}"${anc} font-family='${tagFam}' font-size="${f(ss)}" font-weight="500" letter-spacing="${f(sls)}" fill="${brand}">${esc(run.sub.trim().toUpperCase())}</text>`;
        end=Math.max(end,yy); yy+=34*sc*big+(ss-hs)*0.8;
        return;
      }
      let groups=[run];
      if(cols===2&&run.length>1){
        let best=1,bestV=1e9;
        for(let k=1;k<run.length;k++){ const a=run.slice(0,k).reduce((t,d)=>t+d.h,0), b=run.slice(k).reduce((t,d)=>t+d.h,0); const v=Math.max(a,b); if(v<bestV){bestV=v;best=k;} }
        groups=[run.slice(0,best),run.slice(best)];
      }
      let next=yy;
      groups.forEach((grp,gi)=>{
        let gy=yy;
        grp.forEach(d=>{
          d.nm.forEach((L2,i)=>{ out+=`<text x="${xs[gi]}" y="${f(gy+i*step)}" font-family='${tagFam}' font-size="${f(ns)}" font-weight="500" letter-spacing="${f(nls)}" fill="${ink}">${esc(L2)}</text>`; });
          if(d.pr&&d.nm.length) out+=priceEl(d.pr,xs[gi],rights[gi],gy,measure(d.nm[0],dFam,500,ns,nls));
          const d0=gy+(d.nm.length?(d.nm.length-1)*step+toDesc:0);
          d.ds.forEach((L2,i)=>{ out+=`<text x="${xs[gi]}" y="${f(d0+i*step)}" font-family='"Bodoni Moda", serif' font-size="${f(ds_)}" font-weight="400" fill="${ink}" fill-opacity="0.9">${esc(L2)}</text>`; });
          if(d.rows) d.rows.forEach((row,i)=>{ const oy=gy+d.o0+i*step, ox=xs[gi]+optIn;
            row.forEach(o=>{
              if(o.dx!==null) out+=`<text x="${f(ox+o.dx)}" y="${f(oy)}" text-anchor="middle" font-family='"Bodoni Moda", serif' font-size="${f(ps)}" font-weight="400" fill="${brand}">·</text>`;
              if(o.t) out+=`<text x="${f(ox+o.x)}" y="${f(oy)}" font-family='"Bodoni Moda", serif' font-size="${f(ds_)}" font-weight="700" fill="${ink}">${esc(o.t)}</text>`;
              if(o.op) out+=`<text x="${f(ox+o.px)}" y="${f(oy)}" font-family='"Bodoni Moda", serif' font-size="${f(ps)}" font-weight="400" fill="${brand}">${esc(o.op)}</text>`; }); });
          else d.opts.forEach((o,i)=>{ const oy=gy+d.o0+i*step, ox=xs[gi]+optIn;
            if(o.t) out+=`<text x="${f(ox)}" y="${f(oy)}" font-family='"Bodoni Moda", serif' font-size="${f(ds_)}" font-weight="700" fill="${ink}">${esc(o.t)}</text>`;
            if(o.op) out+=priceEl(o.op,ox,rights[gi],oy,o.t?measure(o.t,'Bodoni Moda',700,ds_,0):0); });
          end=Math.max(end,gy+d.lastOff); gy+=d.h;
        });
        next=Math.max(next,gy);
      });
      yy=next;
    });
    first=false;
  });
  return {svg:out,end,room};
}
// the menu text; with “Spread out” on, the gaps between dishes and sections grow (up to MAXSPREAD times) so the menu reaches the bottom margin
const MAXSPREAD=2.2;
function menuSVG(S,G,M,top=200){
  const MENU_BOTTOM=(G._ph||1100)-(G.bottom??64), r=menuLayout(S,G,M,top,1);
  if(G.fill===false||r.end>=MENU_BOTTOM) return r;
  if(menuLayout(S,G,M,top,MAXSPREAD).end<=MENU_BOTTOM) return menuLayout(S,G,M,top,MAXSPREAD);
  let lo=1,hi=MAXSPREAD;
  for(let i=0;i<16;i++){ const mid=(lo+hi)/2; if(menuLayout(S,G,M,top,mid).end<=MENU_BOTTOM) lo=mid; else hi=mid; }
  return menuLayout(S,G,M,top,lo);
}

// How far the Header tab's logo and pieces reach, top and bottom (in that header's own units). Mirrors LAYOUTS.hd.build.
function headerExtent(S,G){
  const cy=G.H/2, seq=shownSeq(G); if(!seq.length) return [cy,cy];
  const s=G.wmScale/100, LB=logoBuild(G.logo,S), lh=120*s, sqH=50*G.sqScale/100;
  const P=prep(S,{base:60,scale:G.onScale});
  const ex={
    name:LB?[cy-1-lh/2+G.wmY,cy-1+lh/2+G.wmY]:[Math.min(cy-61+G.wmY-120*(s-1)/2,cy+58+G.onY-P.onSize*0.75),Math.max(cy-61+G.wmY+120*(s+1)/2,cy+58+G.onY+P.onSize*0.05)],
    sq:[cy-11+G.sqY,cy-11+G.sqY+sqH],
    tag:[cy+58+G.tagY-G.tagSize*0.75,cy+58+G.tagY+G.tagSize*0.1]};
  return [Math.max(0,Math.min(...seq.map(p=>ex[p][0]))),Math.min(G.H,Math.max(...seq.map(p=>ex[p][1])))];
}

const SHEET_HEAD=['Section','Dish','What’s in it','Price'];
function menuRows(){

/* ============ UNDO / REDO for the menus (words and look of every menu, and which one is open) ============
   Every change is kept as a step: render() calls autosave(), which waits for a short pause and then records the step
   (so typing a word is one step, not one per letter). Things that delete or replace work go through histAct(label, fn),
   which records the step right away, with a name, so Undo can say what it put back. */
const HIST={past:[],future:[],cur:null,label:'',timer:null,max:100,dirty:false};
function histSnap(){ storeMenu(); return JSON.stringify({menus:MENUS}); }
// record a step if anything changed since the last one
function histCheck(){
  clearTimeout(HIST.timer); HIST.timer=null;
  if(!MENUS.current) return;
  const s_=histSnap();
  if(HIST.cur==null){ HIST.cur=s_; return; }
  if(s_===HIST.cur){ HIST.label=''; return; }
  HIST.past.push({state:HIST.cur,label:HIST.label||'your last change'}); if(HIST.past.length>HIST.max) HIST.past.shift();
  HIST.future=[]; HIST.cur=s_; HIST.label=''; HIST.dirty=true; histButtons();
}
// waits for a pause, but never more than 1.5 s after the first change (the page redraws a lot while fonts load)
const histLater=()=>{ const now=Date.now(); if(!HIST.timer) HIST.since=now; else if(now-HIST.since>1500) return; clearTimeout(HIST.timer); HIST.timer=setTimeout(histCheck,700); };
// do something that deletes or replaces work, as its own named step
function histAct(label,fn){ histCheck(); HIST.label=label; fn(); histCheck(); }
function histGo(back){
  histCheck();
  const from=back?HIST.past:HIST.future, to=back?HIST.future:HIST.past; if(!from.length) return;
  const e=from.pop(); to.push({state:HIST.cur,label:e.label});
  MENUS=JSON.parse(e.state).menus; useMenu(MENUS.current,false); HIST.dirty=true;
  buildPanel(); render(); HIST.cur=histSnap();
  menuSay((back?'Undid: ':'Redid: ')+e.label+'.');
}
function histButtons(){
  const u=panel.querySelector('.mundo'), r=panel.querySelector('.mredo'); if(!u) return;
  u.disabled=!HIST.past.length; r.disabled=!HIST.future.length;
  u.title=HIST.past.length?'Undo: '+HIST.past[HIST.past.length-1].label:'Nothing to undo';
  r.title=HIST.future.length?'Redo: '+HIST.future[HIST.future.length-1].label:'Nothing to redo';
}

function readMenuFile(text,fileName){
  text=String(text).replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const i=text.search(/^-{3,}\s*How the page looks/im);
  const words=parseMenuText(i>=0?text.slice(0,i):text), look={}; let name='';
  if(i>=0) text.slice(i).split('\n').slice(1).forEach(l=>{
    const j=l.indexOf(':'); if(j<0) return; const lab=l.slice(0,j).trim().toLowerCase(), v=l.slice(j+1).trim();
    if(lab==='menu name'){ name=v; return; }
    const e=LOOKFILE.find(x=>x[1].toLowerCase()===lab); if(!e) return; const [k,,kind]=e;
    if(kind==='yes') look[k]=!/^(no|off|false)$/i.test(v);
    else if(kind==='price') look[k]=/name/i.test(v)?'name':'edge';
    else if(kind==='sheet') look[k]=/half|halves|two/i.test(v)?'halves':'full';
    else if(kind==='name') look[k]=/^same menu$/i.test(v)?'':v;
    else if(kind==='color'){ if(/^#[0-9a-f]{6}$/i.test(v)) look[k]=v; }
    else { const n=parseFloat(v); if(isFinite(n)) look[k]=n; }
  });
  if(!name) name=String(fileName||'').replace(/\.txt$/i,'').replace(/\s*-\s*meme on 10 menu.*$/i,'').trim();

}

function fileProblem(fl){

  if(!OPEN.mn) OPEN.mn=new Set();
  if(!OPEN.mn.has(H.sec)){ OPEN.mn.add(H.sec); buildPanel(); }
  const row=[...panel.querySelectorAll('.row2')].find(r=>{ const l=r.querySelector('label'); return l&&l.textContent.trim()===H.row; });
  if(row){ row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); row.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function menuNudge(h,delta){
  if(h==='secprice'){ setSecPrice(delta>0?'edge':'name'); return; }
  if(h==='price'){ const g=G.mn; if(g.pricePos==='name') g.priceGap=Math.max(8,Math.min(200,(g.priceGap??14)+delta)); else g.priceIn=Math.max(0,Math.min(300,(g.priceIn||0)-delta)); render(); sync(); return; }
  const H=MN_H[h], v=handleValue(h,get(H.key),delta); if(v!==get(H.key)){ put(H.key,v); render(); sync(); }
}
function pick(ev){
  const svg=svgEl(); if(!svg||cur==='mn') return null;
  const s=svg.getBoundingClientRect(), k=LAST.W/s.width, px=(ev.clientX-s.left)*k, py=(ev.clientY-s.top)*k, sl=6*k;
  let best=null,area=1e18;
  svg.querySelectorAll('[data-el]').forEach(el=>{
    const n=el.dataset.el; let hit=false, a=0;
    const b=boxOf(el,svg);
    if(n==='oval'){            // only the line itself, not the empty space inside it
      const cx=b.x+b.w/2, cy=b.y+b.h/2, rx=b.w/2, ry=b.h/2, d=Math.hypot((px-cx)/rx,(py-cy)/ry);
      const tolN=(10*k)/Math.min(rx,ry); hit=Math.abs(d-1)<tolN; a=1e17;
    } else if(n==='tag'&&el.getNumberOfChars){   // follow the letters, even when the line is curved
      for(let i=0;i<el.getNumberOfChars()&&!hit;i++){ const r=el.getExtentOfChar(i); if(r.width&&px>=r.x-sl&&px<=r.x+r.width+sl&&py>=r.y-sl&&py<=r.y+r.height+sl) hit=true; }
      a=1e6;
    } else { hit=px>=b.x-sl&&px<=b.x+b.w+sl&&py>=b.y-sl&&py<=b.y+b.h+sl; a=b.w*b.h; }
    if(hit&&a<area){area=a;best=n;}
  });
  return best;
}
// selecting a part opens its section in the sidebar (and closes the others)
function selectEl(k){
  sel=k;
  if(k){
    const acc=panel.querySelector(`.acc[data-sec="${k}"]`);
    if(acc){
      if(!OPEN[cur]) OPEN[cur]=new Set();
      panel.querySelectorAll('.acc.open').forEach(a=>{ if(a!==acc){ a.classList.remove('open'); a.querySelector('.acc-h').setAttribute('aria-expanded',false); OPEN[cur].delete(a.dataset.sec); } });
      acc.classList.add('open'); acc.querySelector('.acc-h').setAttribute('aria-expanded',true); OPEN[cur].add(k);
      requestAnimationFrame(()=>acc.scrollIntoView({block:'nearest',behavior:'smooth'}));
    }
  }
  overlay();
}
const PARTS=['oval','wm','on','sq','tag'];
const SIZEKEY={wm:['wmScale'],on:['onScale'],sq:['sqScale'],tag:['tagSize'],oval:['rx','ry']};
function partsHere(){ const svg=svgEl(); return svg?PARTS.filter(p=>svg.querySelector(`[data-el="${p}"]`)):[]; }
function resizeSel(m){
  (SIZEKEY[sel]||[]).filter(k=>k in G[cur]).forEach(k=>{
    const sp=rangeOf(cur,k), step=sp?sp[5]:1, old=G[cur][k];
    let v=old+m*step; if(sp) v=Math.min(sp[4],Math.max(sp[3],v)); v=Math.round(v*1000)/1000;
    G[cur][k]=v; propagate(k,old,v);
  });
  render(); sync();
}
(function(){
  // no dragging: clicking a part only selects it; the keyboard moves it
  const cv=document.getElementById('canvas');
  cv.addEventListener('pointerdown',ev=>{
    if(cur==='mn'){ if(ev.button!==0) return; const h=menuHit(ev);
      if(!h){ if(mnSel){ mnSel=null; overlay(); } return; }
      mnSel=h; cv.focus({preventScroll:true});
      if(h==='price'){ const r=svgEl().getBoundingClientRect(); dragPrice(ev,cv,((LAST.guides||{}).vw||850)/r.width); return; }
      if(h==='secprice'){ const r=svgEl().getBoundingClientRect(); dragSecPrice(ev,cv,((LAST.guides||{}).vw||850)/r.width); return; }
      const H=MN_H[h], r=svgEl().getBoundingClientRect(), k=((LAST.guides||{}).vw||850)/r.width, start=get(H.key), p0=H.axis==='x'?ev.clientX:ev.clientY;
      mnDrag=h; cv.setPointerCapture(ev.pointerId); ev.preventDefault();
      const move=e=>{ const v=handleValue(h,start,((H.axis==='x'?e.clientX:e.clientY)-p0)*k); if(v!==get(H.key)){ put(H.key,v); render(); sync(); } };
      const up=()=>{ mnDrag=null; cv.removeEventListener('pointermove',move); cv.removeEventListener('pointerup',up); cv.removeEventListener('pointercancel',up); overlay(); showMenuRow(h); };
      cv.addEventListener('pointermove',move); cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); overlay(); return; }
    selectEl(pick(ev)); ev.preventDefault(); });
  cv.addEventListener('pointerenter',()=>{ mnHover=true; if(cur==='mn') overlay(); });
  cv.addEventListener('pointerleave',()=>{ mnHover=false; mnHot=null; if(cur==='mn'&&!mnDrag) overlay(); });
  cv.addEventListener('pointermove',ev=>{ if(cur!=='mn'){ cv.style.cursor=''; return; } if(mnDrag) return;
    const h=menuHit(ev); cv.style.cursor=!h?'':MN_H[h].axis==='x'?'ew-resize':'ns-resize';
    const hot=['head','body'].includes(h)?null:h; if(hot!==mnHot){ mnHot=hot; overlay(); } });
  document.addEventListener('keydown',ev=>{
    const tg=ev.target.tagName; if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA') return;
    if(cur==='mn'&&mnSel&&!ev.metaKey&&!ev.ctrlKey){
      if(ev.key==='Escape'){ mnSel=null; overlay(); return; }
      const H=MN_H[mnSel], dir=H.axis==='x'?{ArrowLeft:-1,ArrowRight:1}[ev.key]:{ArrowUp:-1,ArrowDown:1}[ev.key];
      if(dir){ ev.preventDefault(); menuNudge(mnSel,dir*(ev.shiftKey?10:1)); }
      return; }
    if(cur==='mn'||ev.metaKey||ev.ctrlKey) return;
    if(ev.key==='Tab'&&sel){ const ps=partsHere(); if(!ps.length) return; ev.preventDefault();
      const i=ps.indexOf(sel); selectEl(ps[(i+(ev.shiftKey?-1:1)+ps.length)%ps.length]); return; }
    if(!sel) return;
    if(ev.key==='Escape'){ selectEl(null); return; }
    if(['Equal','Minus','NumpadAdd','NumpadSubtract'].includes(ev.code)){ ev.preventDefault();
      resizeSel(((ev.code==='Equal'||ev.code==='NumpadAdd')?1:-1)*(ev.shiftKey?10:1)); return; }
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key]; if(!d) return;
    const [kx,ky]=ELKEYS[sel]; const n=ev.shiftKey?10:1; let ch=false;
    const mv=(key,by)=>{ G[cur][key]=Math.round((G[cur][key]+by)*100)/100; ch=true; };
    if(kx&&kx in G[cur]&&d[0]) mv(kx,d[0]*n); if(ky&&ky in G[cur]&&d[1]) mv(ky,d[1]*n);
    if(ch){ ev.preventDefault(); render(); sync(); }
  });
})();
// the controls sidebar can be made wider or narrower (drag its left edge; double-click to reset)
(function(){
  const g=document.getElementById('grip'), root=document.documentElement, MIN=320, DEF=420;
  const max=()=>Math.max(MIN,Math.min(1000,window.innerWidth-380));
  const now=()=>parseInt(getComputedStyle(root).getPropertyValue('--side'))||DEF;
  const setW=w=>{ root.style.setProperty('--side',Math.round(Math.min(max(),Math.max(MIN,w)))+'px'); };
  const save=()=>{ try{ localStorage.setItem('meme10_side',now()); }catch(e){} };
  try{ const w=+localStorage.getItem('meme10_side'); if(w) setW(w); }catch(e){}
  let drag=false;
  g.addEventListener('pointerdown',e=>{ drag=true; g.setPointerCapture(e.pointerId); g.classList.add('on'); document.body.classList.add('resizing'); e.preventDefault(); });
  g.addEventListener('pointermove',e=>{ if(drag){ setW(window.innerWidth-e.clientX-4); overlay(); } });
  const end=()=>{ if(!drag) return; drag=false; g.classList.remove('on'); document.body.classList.remove('resizing'); save(); overlay(); };
  g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',()=>{ root.style.removeProperty('--side'); try{ localStorage.removeItem('meme10_side'); }catch(e){} overlay(); });
  g.addEventListener('keydown',e=>{ const d={ArrowLeft:20,ArrowRight:-20}[e.key]; if(!d) return; e.preventDefault(); e.stopPropagation(); setW(now()+d); save(); overlay(); });
  window.addEventListener('resize',()=>{ if(now()>max()) setW(max()); overlay(); });
})();

function autosave(){ try{ localStorage.setItem('meme10_last',JSON.stringify({cur,S,G,M,mode,menuMode,links:[...LINKS]})); }catch(e){} storeMenu(); if(HIST.cur==null) histCheck(); else histLater(); }
function restore(){ try{ const v=JSON.parse(localStorage.getItem('meme10_last')||'null'); if(!v) return;
  S=Object.assign({},SHARED_DEFAULTS,v.S); Object.keys(LAYOUTS).forEach(k=>G[k]=Object.assign({},LAYOUTS[k].geo,(v.G||{})[k])); if(LAYOUTS[v.cur]) cur=v.cur; LINKS=new Set(v.links||[]); if(v.mode) mode=v.mode; if(v.M) M=v.M; if(v.menuMode) menuMode=menuBack=v.menuMode==='docs'||v.menuMode==='text'?'text':'boxes'; /* Typing and Google Docs are one mode (Text); Google Sheets opens as Boxes */ }catch(e){} }
restore(); loadVersions(); loadMenus(); HIST.cur=null;
{ const h=decodeURIComponent(location.hash.slice(1)); if(h==='menu') cur='mn'; else if(LAYOUTS[h]) cur=h; else if(cur==='mn' && h!=='mn') cur='1b';
  // Keep the address in step with what is shown, so the top nav underlines the right tab.
  history.replaceState(null,'','#'+(cur==='mn'?'menu':cur)); window.dispatchEvent(new HashChangeEvent('hashchange')); }
buildPanel(); render(); HIST.cur=histSnap(); HIST.past=[]; HIST.dirty=false; histButtons();
if(document.fonts){
  const loaded=()=>[...document.fonts].filter(f=>f.status==='loaded').length;
  let seen=loaded(), timer=null;
  const again=()=>{ clearTimeout(timer); timer=setTimeout(()=>{ const n=loaded(); if(n!==seen){ seen=n; render(); } },120); };
  document.fonts.ready.then(again); document.fonts.onloadingdone=again;
}
