<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mémé on 10 Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--fg:#2b2724;--muted:#6f685f;--rule:#d6cfc3;--olive:#56603c;--cream:#f4eee2;
 --display:'Bodoni Moda',Didot,'Bodoni 72',Georgia,serif;--body:Jost,'Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:560px;padding:48px 16px}
.label{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:18px}
h1{font:700 clamp(34px,7vw,52px)/1.05 var(--display);color:var(--olive);margin:0 0 32px}
nav{display:grid;gap:12px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px;background:#fff;border:1px solid var(--rule);border-radius:4px;color:var(--fg);text-decoration:none;font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
nav a span{color:var(--olive);font-size:18px;letter-spacing:0}
nav a:hover,nav a:focus-visible{background:var(--olive);border-color:var(--olive);color:var(--cream);outline:none}
nav a:hover span,nav a:focus-visible span{color:var(--cream)}
</style>
</head>
<body>
<main>
 <div class="label">Tools</div>
 <h1>Mémé on 10</h1>
 <nav>
  <a href="editor.html#menu">Menu Copy Editor <span>→</span></a>
  <a href="editor.html#logo">Logo Editor <span>→</span></a>
  <a href="brand-guide.html">Brand Guidelines <span>→</span></a>
  <a href="brand-guide.html#social">Social Media <span>→</span></a>
 </nav>
</main>
</body>
</html>
